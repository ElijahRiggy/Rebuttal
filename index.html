<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebuttal — pick a side</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181D27;
    --ink-soft:#4B5266;
    --ink-mute:#8A90A0;
    --paper:#FBFAF8;
    --surface:#FFFFFF;
    --surface-sunken:#F3F1ED;
    --hairline:#E7E4DD;
    --hairline-strong:#D6D2C8;
    --wine:#7A2333;
    --wine-hover:#611B28;
    --wine-tint:#FBEDEF;
    --wine-tint-2:#F0D4D9;
    --logo-red:#D6293F;
    --amber:#8A5A12;
    --amber-tint:#F5EBD6;
    --slate:#39506B;
    --slate-tint:#E4EAF0;
    --forest:#1F6B54;
    --forest-tint:#E9F5EF;
    --forest-tint-2:#CFEADB;
    --shadow-sm:0 1px 2px rgba(24,29,39,.05);
    --shadow-md:0 6px 20px rgba(24,29,39,.07);
    --shadow-lg:0 16px 40px rgba(24,29,39,.10);
  }
  *{box-sizing:border-box;}
  html{font-size:17px;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 40px 100px;}
  @media (max-width:720px){ .wrap{padding:0 20px 80px;} }

  header.site{
    display:flex;align-items:center;justify-content:space-between;
    padding:30px 0;border-bottom:1px solid var(--hairline);
    margin-bottom:0;flex-wrap:wrap;gap:14px;
  }
  .wordmark{
    font-family:'Manrope', sans-serif;
    font-size:24px;font-weight:800;letter-spacing:-0.02em;
    display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);
  }
  .logo-mark{
    width:26px;height:32px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .logo-mark svg{width:100%;height:100%;display:block;}
  .tag{font-size:14px;color:var(--ink-mute);font-weight:500;}
  .btn{
    font-family:'Public Sans',sans-serif;font-size:15px;font-weight:600;
    border:1.5px solid var(--ink);background:transparent;color:var(--ink);
    padding:12px 22px;border-radius:10px;cursor:pointer;transition:all .15s;
  }
  .btn:hover{background:var(--ink);color:#fff;}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn:disabled:hover{background:transparent;color:var(--ink);}
  .btn.ghost{border-color:var(--hairline-strong);color:var(--ink-soft);background:var(--surface);}
  .btn.ghost:hover{background:var(--surface-sunken);color:var(--ink);border-color:var(--ink-mute);}
  .btn.primary{background:var(--wine);color:#fff;border-color:var(--wine);box-shadow:var(--shadow-sm);}
  .btn.primary:hover{background:var(--wine-hover);border-color:var(--wine-hover);box-shadow:var(--shadow-md);}
  .btn.primary:disabled{opacity:.45;box-shadow:none;}

  .nav-right{display:flex;align-items:center;gap:20px;}
  .messages-nav{
    font-family:'Public Sans',sans-serif;font-size:14.5px;font-weight:600;color:var(--ink-soft);
    background:var(--surface-sunken);border:none;border-radius:20px;padding:8px 16px;cursor:pointer;
  }
  .messages-nav:hover{background:var(--hairline-strong);color:var(--ink);}
  .messages-nav.active{background:var(--wine);color:#fff;}
  .badge-dot{background:var(--wine);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:5px;}
  .messages-nav.active .badge-dot{background:#fff;color:var(--wine);}

  /* Hero */
  .hero{padding:56px 0 44px;border-bottom:1px solid var(--hairline);margin-bottom:36px;}
  .hero h1{font-family:'Manrope',sans-serif;font-size:48px;font-weight:800;letter-spacing:-0.02em;line-height:1.08;margin:0 0 16px;max-width:680px;}
  .hero h1 .accent{color:var(--wine);}
  .hero p{font-size:18px;color:var(--ink-soft);max-width:520px;line-height:1.55;margin:0 0 28px;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px;}
  .stat-row{display:flex;gap:40px;flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;}
  .stat .num{font-family:'Manrope',sans-serif;font-size:30px;font-weight:800;color:var(--ink);}
  .stat .lbl{font-size:13px;color:var(--ink-mute);font-weight:600;}

  /* Topic list — elevated cards */
  .list-controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  .category-filters{display:flex;flex-wrap:wrap;gap:8px;}
  .category-chip{font-family:'Public Sans',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink-soft);background:var(--surface-sunken);border:none;border-radius:20px;padding:7px 15px;cursor:pointer;}
  .category-chip:hover{background:var(--hairline-strong);color:var(--ink);}
  .category-chip.active{background:var(--ink);color:#fff;}
  .sort-toggle{display:flex;gap:4px;background:var(--surface-sunken);border-radius:20px;padding:3px;}
  .sort-btn{font-family:'Public Sans',sans-serif;font-size:13px;font-weight:600;color:var(--ink-soft);background:none;border:none;border-radius:16px;padding:6px 14px;cursor:pointer;}
  .sort-btn.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}

  .row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
    padding:26px 28px;border-radius:16px;background:var(--surface);
    border:1px solid var(--hairline);margin-bottom:14px;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .15s,border-color .15s;
  }
  .row:hover{box-shadow:var(--shadow-md);border-color:var(--hairline-strong);transform:translateY(-1px);}
  .row-title{
    font-family:'Manrope',sans-serif;font-size:21px;font-weight:700;margin:0 0 8px;
    line-height:1.32;color:var(--ink);letter-spacing:-0.01em;
  }
  .row-desc{font-size:14.5px;color:var(--ink-soft);margin:0;max-width:560px;line-height:1.55;}
  .row-meta{
    display:flex;gap:16px;align-items:center;white-space:nowrap;
    font-size:13px;color:var(--ink-mute);font-weight:600;
    padding-top:4px;
  }
  .score-bar{
    display:flex;width:56px;height:6px;border-radius:3px;overflow:hidden;background:var(--hairline);
  }
  .score-bar .p{background:var(--forest);height:100%;}
  .score-bar .c{background:var(--wine);height:100%;}
  .trending-tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--wine);background:var(--wine-tint);border-radius:12px;padding:3px 10px;margin-bottom:10px;letter-spacing:.01em;}

  .empty{padding:72px 40px;text-align:center;color:var(--ink-soft);background:var(--surface);border-radius:16px;border:1px dashed var(--hairline-strong);}
  .empty h3{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;color:var(--ink);margin-bottom:8px;}
  .empty-icon{margin-bottom:14px;opacity:.5;}
  .empty-icon svg{width:44px;height:44px;}

  .banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--wine-tint);border-radius:12px;
    padding:14px 18px;margin-bottom:22px;font-size:14px;color:var(--ink);
  }
  .banner .btn{padding:6px 14px;font-size:13px;}

  /* New topic form */
  .panel{
    background:var(--surface);border:1px solid var(--hairline);border-radius:18px;
    padding:36px;margin-bottom:28px;box-shadow:var(--shadow-sm);
  }
  .panel h2{font-family:'Manrope',sans-serif;font-size:24px;font-weight:800;margin:0 0 22px;letter-spacing:-0.01em;}
  label{display:block;font-size:13px;color:var(--ink-mute);font-weight:700;margin-bottom:8px;letter-spacing:.01em;}
  input[type=text], textarea{
    width:100%;font-family:'Public Sans',sans-serif;font-size:16px;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--hairline-strong);border-radius:10px;padding:13px 16px;
    margin-bottom:20px;resize:vertical;
  }
  input[type=text]::placeholder, textarea::placeholder{color:var(--ink-mute);}
  input[type=text]:focus, textarea:focus{outline:none;border-color:var(--ink);}
  .err{font-size:13px;color:var(--wine);margin:-14px 0 18px;font-weight:500;}
  .form-actions{display:flex;gap:12px;}

  /* Debate view */
  .back{font-family:'Public Sans',sans-serif;font-size:14px;font-weight:600;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:0;margin-bottom:26px;display:inline-flex;align-items:center;gap:6px;}
  .back:hover{color:var(--ink);}
  .topic-head{margin-bottom:26px;}
  .topic-head h1{font-family:'Manrope',sans-serif;font-size:38px;font-weight:800;line-height:1.15;letter-spacing:-0.02em;margin:0 0 14px;}
  .topic-head p{font-size:16.5px;color:var(--ink-soft);line-height:1.6;margin:0;max-width:660px;}

  .tally{
    display:flex;border-radius:16px;overflow:hidden;margin-bottom:24px;border:1px solid var(--hairline);
  }
  .tally .side{flex:1;padding:20px 24px;}
  .tally .side.pro{background:var(--forest-tint);}
  .tally .side.con{background:var(--wine-tint);}
  .tally .side .n{font-size:32px;font-weight:800;font-family:'Manrope',sans-serif;}
  .tally .side.pro .n{color:var(--forest);}
  .tally .side.con .n{color:var(--wine);}
  .tally .side .l{font-size:12.5px;color:var(--ink-soft);font-weight:600;letter-spacing:.01em;}

  .challenge-row{display:flex;justify-content:flex-start;margin:0 0 30px;}
  .challenge-btn{font-family:'Public Sans',sans-serif;font-size:14px;font-weight:600;color:var(--ink-soft);background:var(--surface-sunken);border:none;border-radius:20px;padding:10px 18px;cursor:pointer;}
  .challenge-btn:hover{background:var(--hairline-strong);color:var(--ink);}

  .columns{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  @media (max-width:760px){.columns{grid-template-columns:1fr;}}
  .col-head{
    display:flex;align-items:baseline;gap:10px;
    padding-bottom:14px;margin-bottom:18px;border-bottom:3px solid;
  }
  .col-head.pro{border-color:var(--forest);}
  .col-head.con{border-color:var(--wine);}
  .col-head span.label{font-family:'Manrope',sans-serif;font-size:19px;font-weight:800;letter-spacing:-0.01em;}
  .col-head.pro span.label{color:var(--forest);}
  .col-head.con span.label{color:var(--wine);}

  .arg-card{
    background:var(--surface);border:1px solid var(--hairline);border-radius:14px;
    padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm);
    border-top:3px solid var(--hairline-strong);
  }
  .arg-card.pro{border-top-color:var(--forest);}
  .arg-card.con{border-top-color:var(--wine);}
  .arg-rank{font-size:11.5px;color:var(--ink-mute);font-weight:700;margin:0 0 8px;letter-spacing:.02em;}
  .arg-text{font-size:15.5px;line-height:1.6;margin:0 0 12px;color:var(--ink);}
  .arg-meta{font-size:12.5px;color:var(--ink-mute);margin:0 0 14px;font-weight:600;}
  .arg-foot{display:flex;align-items:center;gap:16px;}
  .vote-widget{display:flex;align-items:center;gap:9px;}
  .vote-arrow{
    background:var(--surface-sunken);border:none;border-radius:8px;
    width:30px;height:28px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-mute);font-size:12px;transition:.12s;padding:0;
  }
  .vote-arrow:hover{background:var(--hairline-strong);color:var(--ink);}
  .vote-arrow.up.active{background:var(--forest);color:#fff;}
  .vote-arrow.down.active{background:var(--wine);color:#fff;}
  .vote-count{font-size:15px;font-weight:700;color:var(--ink);min-width:16px;text-align:center;}
  .debate-btn{font-family:'Public Sans',sans-serif;font-size:13px;font-weight:600;color:var(--wine);background:var(--wine-tint);border:none;border-radius:16px;padding:6px 14px;cursor:pointer;}
  .debate-btn:hover{background:var(--wine-tint-2);}

  .add-arg{margin-top:12px;}
  .add-arg textarea{margin-bottom:10px;min-height:76px;}
  .add-arg .btn{width:100%;font-size:14.5px;padding:12px 20px;}
  .add-arg .btn.pro-btn{border-color:var(--forest);color:var(--forest);}
  .add-arg .btn.pro-btn:hover{background:var(--forest);color:#fff;}
  .add-arg .btn.con-btn{border-color:var(--wine);color:var(--wine);}
  .add-arg .btn.con-btn:hover{background:var(--wine);color:#fff;}

  .col-empty{font-size:14px;color:var(--ink-mute);padding:24px;text-align:center;background:var(--surface-sunken);border-radius:12px;margin-bottom:16px;}
  .loading{padding:72px 0;text-align:center;color:var(--ink-mute);font-size:15px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(24,29,39,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:backdropIn .18s ease-out;}
  .modal{background:var(--surface);border-radius:20px;border:1px solid var(--hairline);padding:34px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);animation:modalIn .22s cubic-bezier(.2,.8,.2,1);}
  @keyframes backdropIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal h3{font-family:'Manrope',sans-serif;font-size:23px;font-weight:800;margin:0 0 18px;color:var(--ink);letter-spacing:-0.01em;}
  .modal .side-choice{display:flex;gap:12px;margin:10px 0 20px;}
  .modal .side-choice button{flex:1;padding:16px;border-radius:12px;border:1.5px solid var(--hairline-strong);background:var(--paper);cursor:pointer;font-family:'Manrope',sans-serif;font-size:17px;font-weight:700;}
  .modal .side-choice button.pro-c{color:var(--forest);}
  .modal .side-choice button.pro-c:hover{background:var(--forest-tint);border-color:var(--forest);}
  .modal .side-choice button.con-c{color:var(--wine);}
  .modal .side-choice button.con-c:hover{background:var(--wine-tint);border-color:var(--wine);}
  .modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;}

  /* Auth */
  .auth-nav{display:flex;align-items:center;gap:16px;}
  .auth-btn{font-family:'Public Sans',sans-serif;font-size:14.5px;font-weight:600;color:var(--ink-soft);background:none;border:none;padding:6px 0;cursor:pointer;}
  .auth-btn:hover{color:var(--ink);}
  .auth-btn.filled{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;}
  .auth-btn.filled:hover{background:var(--wine);}
  .user-chip{font-size:14px;color:var(--ink-soft);}
  .user-chip strong{color:var(--ink);font-weight:700;}
  .setup-screen{max-width:680px;margin:70px auto;padding:0 28px;}
  .setup-screen h1{font-family:'Manrope',sans-serif;font-size:32px;font-weight:800;margin:0 0 16px;letter-spacing:-0.02em;}
  .setup-screen p{font-size:15.5px;color:var(--ink-soft);line-height:1.65;}
  .setup-screen ol{font-size:15.5px;color:var(--ink-soft);line-height:2;padding-left:22px;}
  .setup-screen code{background:var(--surface-sunken);border-radius:5px;padding:2px 7px;font-family:ui-monospace,monospace;font-size:13px;color:var(--ink);}
  .setup-screen pre{background:var(--surface-sunken);border-radius:12px;padding:20px 22px;font-family:ui-monospace,monospace;font-size:13px;overflow-x:auto;color:var(--ink);}

  .category-badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--wine);font-weight:700;margin-bottom:10px;background:var(--wine-tint);border-radius:12px;padding:4px 12px;}
  select#t-category{
    width:100%;font-family:'Public Sans',sans-serif;font-size:16px;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--hairline-strong);border-radius:10px;padding:13px 16px;
    margin-bottom:20px;
  }

  /* Share + toast */
  .topic-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;}
  .share-btn{font-family:'Public Sans',sans-serif;font-size:14px;font-weight:600;color:var(--ink-soft);background:var(--surface-sunken);border:none;border-radius:20px;padding:10px 18px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .share-btn:hover{background:var(--hairline-strong);color:var(--ink);}
  .toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:14.5px;font-weight:500;padding:13px 24px;
    border-radius:12px;z-index:60;box-shadow:var(--shadow-lg);
    animation:toastIn .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  /* Inbox / profile list */
  .thread-row{
    display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:14px;
    background:var(--surface);border:1px solid var(--hairline);border-left:4px solid transparent;margin-bottom:10px;cursor:pointer;
    transition:box-shadow .15s,transform .15s,background .15s;
  }
  .thread-row:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
  .thread-row.unread-row{background:var(--surface-sunken);}
  .thread-row.row-in{animation:rowIn .35s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes rowIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .avatar{
    border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;
    width:46px;height:46px;
  }
  .avatar-lg{width:52px;height:52px;font-size:19px;}
  .avatar-xs{width:26px;height:26px;font-size:11px;}
  .avatar-sm{width:28px;height:28px;font-size:11px;flex-shrink:0;}
  .avatar-sm-spacer{width:28px;flex-shrink:0;}
  .thread-info{flex:1;min-width:0;}
  .thread-top{display:flex;justify-content:space-between;gap:10px;}
  .thread-name{font-family:'Manrope',sans-serif;font-size:16.5px;font-weight:700;margin:0;}
  .thread-time{font-size:12.5px;color:var(--ink-mute);white-space:nowrap;font-weight:500;}
  .thread-topic{font-size:12px;color:var(--wine);font-weight:600;margin:2px 0 0;}
  .thread-preview{font-size:14px;color:var(--ink-soft);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .thread-preview.unread{color:var(--ink);font-weight:600;}
  .unread-dot{width:9px;height:9px;border-radius:50%;background:var(--wine);flex-shrink:0;animation:unreadPulse 1.8s ease-in-out infinite;}
  @keyframes unreadPulse{0%,100%{box-shadow:0 0 0 0 rgba(122,35,51,.35);}50%{box-shadow:0 0 0 5px rgba(122,35,51,0);}}

  /* Chat view */
  .chat-head{display:flex;align-items:center;gap:16px;margin-bottom:28px;padding:18px 22px;border-radius:16px;}
  .chat-head h1{font-family:'Manrope',sans-serif;font-size:23px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;}
  .topic-chip{font-family:'Public Sans',sans-serif;font-size:12px;font-weight:700;background:rgba(255,255,255,.65);border:none;border-radius:14px;padding:5px 13px;cursor:pointer;color:var(--ink);}
  .topic-chip:hover{background:rgba(255,255,255,.9);}
  .thread{display:flex;flex-direction:column;margin-bottom:22px;min-height:140px;}
  .msg-row-theirs{display:flex;align-items:flex-end;gap:8px;align-self:flex-start;max-width:78%;margin-bottom:3px;}
  .msg-row-theirs .msg{margin-bottom:0;}
  .msg{max-width:70%;padding:12px 17px;border-radius:16px;font-size:15px;line-height:1.55;margin-bottom:14px;box-shadow:var(--shadow-sm);}
  .msg.msg-mid{margin-bottom:3px;}
  .msg .m-time{font-size:11px;margin-top:6px;opacity:.6;}
  .msg.mine{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px;}
  .msg.mine.msg-cont{border-top-right-radius:4px;}
  .msg.theirs{background:var(--surface);border:1px solid var(--hairline);color:var(--ink);border-bottom-left-radius:4px;}
  .msg.theirs.msg-cont{border-top-left-radius:4px;}
  .msg.msg-new{animation:msgIn .32s cubic-bezier(.2,.8,.2,1);}
  @keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

  /* Author links */
  .author-link{cursor:pointer;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid transparent;}
  .author-link:hover{color:var(--wine);border-bottom-color:var(--wine);}

  /* Profile */
  .avatar-xl{width:96px;height:96px;font-size:32px;flex-shrink:0;}
  .profile-card{display:flex;gap:28px;align-items:flex-start;background:var(--surface);border:1px solid var(--hairline);border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:var(--shadow-sm);flex-wrap:wrap;}
  .profile-main{flex:1;min-width:220px;}

<div class="wrap" id="app">
  <div class="loading">loading rebuttal…</div>
</div>

<script type="module">
/* ================== FIREBASE SETUP ==================
   1. Go to https://console.firebase.google.com, create a free project.
   2. In the project, click the "</>" (web app) icon to register a web app — this gives you a config object.
   3. Enable Authentication → Sign-in method → Email/Password.
   4. Enable Firestore Database → Create database → Start in production mode (rules are provided in the README).
   5. Paste your config object below, replacing the placeholder.
====================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDAa8I3tatze2LvOXAv76ojbyyAXHbtRc4",
  authDomain: "rebuttal-debate.firebaseapp.com",
  projectId: "rebuttal-debate",
  storageBucket: "rebuttal-debate.firebasestorage.app",
  messagingSenderId: "152941002207",
  appId: "1:152941002207:web:6350d27697419aaf3b186a"
};

const NEEDS_SETUP = firebaseConfig.apiKey === "YOUR_API_KEY";

const CATEGORIES = ['Society', 'Technology', 'Politics', 'Health', 'Entertainment', 'Sports', 'Science', 'Other'];

let app, auth, db;
let fb = {}; // holds imported firestore/auth functions once loaded

if (!NEEDS_SETUP) {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  app = initializeApp(firebaseConfig);
  auth = authMod.getAuth(app);
  db = fsMod.getFirestore(app);
  fb = { ...authMod, ...fsMod };
}

const state = {
  view: 'list', user: null, authError: null,
  topics: [], categoryFilter: 'all', sortMode: 'newest',
  currentTopicId: null, currentTopic: null, currentArgs: [],
  threads: [], currentThreadId: null, currentThread: null, chatWithUid: null, chatWithName: null, chatMessages: [],
  chatAutoFocusPending: false, lastRenderedMsgCount: -1, inboxHasLoadedOnce: false,
  viewingProfileUid: null, viewingProfile: null, viewingProfileLoaded: false, viewingProfileDebates: [],
  submittingProfile: false, pendingPhotoDataUrl: null, myProfile: null, userMenuOpen: false, selectedPolitical: null,
  submittingTopic: false, submittingArg: { pro: false, con: false }, submittingMsg: false, submittingAuth: false,
  topicUnsubs: [], chatUnsubs: [], globalUnsubs: [],
  toastMsg: null, toastTimer: null
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ const d=document.createElement('div'); d.textContent=s ?? ''; return d.innerHTML; }
function timeAgo(ts){
  if(!ts) return '';
  const ms = ts.toMillis ? ts.toMillis() : ts;
  const s = Math.floor((Date.now()-ms)/1000);
  if(s<60) return 'just now';
  const m = Math.floor(s/60); if(m<60) return m+'m';
  const h = Math.floor(m/60); if(h<24) return h+'h';
  const d = Math.floor(h/24); return d+'d';
}
function initials(name){
  const parts = (name||'?').trim().split(/\s+/).slice(0,2);
  return parts.map(w=>w[0].toUpperCase()).join('') || '?';
}
function avatarStyle(name){
  const palette = [
    {bg:'var(--forest-tint)', text:'var(--forest)'},
    {bg:'var(--wine-tint)', text:'var(--wine)'},
    {bg:'var(--amber-tint)', text:'var(--amber)'},
    {bg:'var(--slate-tint)', text:'var(--slate)'}
  ];
  let hash = 0;
  for(const c of (name||'')) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
  return palette[hash % palette.length];
}
function avatarHtml(name, photoURL, sizeClass){
  if(photoURL){
    return `<img src="${esc(photoURL)}" alt="" class="avatar ${sizeClass||''}" style="object-fit:cover;" onerror="this.outerHTML=window.__avatarFallback('${esc(name).replace(/'/g,"&#39;")}','${sizeClass||''}')">`;
  }
  const av = avatarStyle(name);
  return `<div class="avatar ${sizeClass||''}" style="background:${av.bg};color:${av.text};">${esc(initials(name))}</div>`;
}
window.__avatarFallback = function(name, sizeClass){
  const av = avatarStyle(name);
  return `<div class="avatar ${sizeClass||''}" style="background:${av.bg};color:${av.text};">${esc(initials(name))}</div>`;
};
function showToast(msg){
  state.toastMsg = msg;
  render();
  if(state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => { state.toastMsg = null; render(); }, 2500);
}
function pushUrl(qs){
  history.pushState({}, '', location.pathname + qs);
}

/* ---------- auth ---------- */
function requireAuth(){
  if(!state.user){ openAuthModal('login'); return false; }
  return true;
}
function friendlyAuthError(code){
  const map = {
    'auth/email-already-in-use': 'That email already has an account — try logging in instead.',
    'auth/invalid-email': 'That email address doesn\'t look right.',
    'auth/weak-password': 'Password needs to be at least 6 characters.',
    'auth/wrong-password': 'Wrong password.',
    'auth/invalid-credential': 'Email or password is incorrect.',
    'auth/user-not-found': 'No account with that email.',
    'auth/too-many-requests': 'Too many attempts — wait a bit and try again.',
    'auth/missing-email': 'Enter your email first.'
  };
  return map[code] || 'Something went wrong. Try again.';
}

function openAuthModal(mode){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const isSignup = mode === 'signup';
  backdrop.innerHTML = `<div class="modal">
    <h3>${isSignup ? 'Create an account' : 'Log in'}</h3>
    ${isSignup ? `<label for="auth-name">Display name</label><input type="text" id="auth-name" placeholder="How others will see you" style="margin-bottom:12px;">` : ''}
    <label for="auth-email">Email</label>
    <input type="text" id="auth-email" placeholder="you@example.com" style="margin-bottom:12px;">
    <label for="auth-pass">Password</label>
    <input type="text" id="auth-pass" placeholder="${isSignup ? 'At least 6 characters' : 'Your password'}" style="margin-bottom:6px;">
    ${!isSignup ? `<button id="auth-forgot" style="background:none;border:none;padding:0;margin:0 0 6px;font-size:12.5px;color:var(--text-mute);cursor:pointer;text-decoration:underline;">Forgot password?</button>` : ''}
    <div id="auth-err" class="err" style="display:none;"></div>
    <div id="auth-info" style="font-size:12.5px;color:var(--pro);margin:-10px 0 14px;display:none;"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="auth-switch">${isSignup ? 'Log in instead' : 'Create account instead'}</button>
      <button class="btn primary" id="auth-submit">${isSignup ? 'Sign up' : 'Log in'}</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  const close = () => { if(document.body.contains(backdrop)) document.body.removeChild(backdrop); };
  backdrop.querySelector('#auth-switch').onclick = () => { close(); openAuthModal(isSignup ? 'login' : 'signup'); };
  if(!isSignup){
    backdrop.querySelector('#auth-forgot').onclick = async () => {
      const email = backdrop.querySelector('#auth-email').value.trim();
      const errEl = backdrop.querySelector('#auth-err');
      const infoEl = backdrop.querySelector('#auth-info');
      errEl.style.display = 'none';
      if(!email){
        errEl.textContent = 'Enter your email above first, then click "Forgot password?" again.';
        errEl.style.display = 'block';
        return;
      }
      const forgotBtn = backdrop.querySelector('#auth-forgot');
      forgotBtn.disabled = true;
      try{
        await fb.sendPasswordResetEmail(auth, email);
        infoEl.textContent = `Reset link sent to ${email} — check your inbox (and spam folder).`;
        infoEl.style.display = 'block';
      }catch(e){
        errEl.textContent = friendlyAuthError(e.code);
        errEl.style.display = 'block';
      }finally{
        forgotBtn.disabled = false;
      }
    };
  }
  backdrop.querySelector('#auth-submit').onclick = async () => {
    if(state.submittingAuth) return;
    const email = backdrop.querySelector('#auth-email').value.trim();
    const pass = backdrop.querySelector('#auth-pass').value;
    const name = isSignup ? backdrop.querySelector('#auth-name').value.trim() : null;
    const errEl = backdrop.querySelector('#auth-err');
    if(!email || !pass || (isSignup && !name)){
      errEl.textContent = 'Fill in all fields.'; errEl.style.display = 'block'; return;
    }
    state.submittingAuth = true;
    const btn = backdrop.querySelector('#auth-submit');
    btn.disabled = true; btn.textContent = isSignup ? 'Creating…' : 'Logging in…';
    try{
      if(isSignup){
        const cred = await fb.createUserWithEmailAndPassword(auth, email, pass);
        await fb.updateProfile(cred.user, { displayName: name });
        await fb.setDoc(fb.doc(db, 'users', cred.user.uid), { displayName: name, email, createdAt: fb.serverTimestamp() });
        state.user = { uid: cred.user.uid, displayName: name, email };
        subscribeInbox();
        render();
      } else {
        await fb.signInWithEmailAndPassword(auth, email, pass);
      }
      close();
    }catch(e){
      errEl.textContent = friendlyAuthError(e.code); errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = isSignup ? 'Sign up' : 'Log in';
    }finally{
      state.submittingAuth = false;
    }
  };
}
async function logOut(){
  await fb.signOut(auth);
  goList();
}

/* ---------- realtime subscriptions ---------- */
function subscribeTopics(){
  const q = fb.query(fb.collection(db, 'topics'), fb.orderBy('createdAt', 'desc'), fb.limit(200));
  const unsub = fb.onSnapshot(q, snap => {
    state.topics = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(state.view === 'list') render();
  }, err => console.error('topics sub error', err));
  state.globalUnsubs.push(unsub);
}
function subscribeInbox(){
  cleanupGlobalInboxSub();
  if(!state.user) { state.threads = []; return; }
  const q = fb.query(fb.collection(db, 'threads'), fb.where('participantUids', 'array-contains', state.user.uid));
  const unsub = fb.onSnapshot(q, snap => {
    state.threads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => console.error('inbox sub error', err));
  state.globalUnsubs.push(unsub);
}
function cleanupGlobalInboxSub(){ /* handled by full teardown on logout if needed */ }
function cleanupTopicSubs(){
  state.topicUnsubs.forEach(u => u());
  state.topicUnsubs = [];
}
function cleanupChatSubs(){
  state.chatUnsubs.forEach(u => u());
  state.chatUnsubs = [];
}

function unreadCount(){
  if(!state.user) return 0;
  return (state.threads || []).filter(t => {
    const lastTs = t.lastTs ? (t.lastTs.toMillis ? t.lastTs.toMillis() : t.lastTs) : 0;
    const readTs = t.lastReadBy && t.lastReadBy[state.user.uid] ? (t.lastReadBy[state.user.uid].toMillis ? t.lastReadBy[state.user.uid].toMillis() : t.lastReadBy[state.user.uid]) : 0;
    return t.lastAuthorUid && t.lastAuthorUid !== state.user.uid && lastTs > readTs;
  }).length;
}

/* ---------- topics / arguments ---------- */
async function submitTopic(){
  if(!requireAuth()) return;
  if(state.submittingTopic) return;
  const title = document.getElementById('t-title').value.trim();
  const desc = document.getElementById('t-desc').value.trim();
  const category = document.getElementById('t-category').value;
  const errEl = document.getElementById('t-err');
  if(!title){ errEl.textContent = 'Give the debate a topic first.'; errEl.style.display = 'block'; return; }
  state.submittingTopic = true;
  const btn = document.getElementById('create-topic-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Creating…'; }
  try{
    const ref = await fb.addDoc(fb.collection(db, 'topics'), {
      title, description: desc, category,
      createdAt: fb.serverTimestamp(),
      createdBy: state.user.uid, createdByName: state.user.displayName,
      proCount: 0, conCount: 0, votes: 0, voterChoices: {}
    });
    await openTopic(ref.id);
  }catch(e){
    alert("Couldn't create that debate. Try again.");
  }finally{
    state.submittingTopic = false;
  }
}

async function openTopic(id){
  cleanupTopicSubs();
  cleanupChatSubs();
  state.currentTopicId = id;
  state.currentTopic = null;
  state.currentArgs = [];
  state.view = 'topic';
  pushUrl('?topic=' + id);
  render();
  const topicUnsub = fb.onSnapshot(fb.doc(db, 'topics', id), d => {
    state.currentTopic = d.exists() ? { id: d.id, ...d.data() } : null;
    render();
  }, err => console.error('topic sub error', err));
  const argsUnsub = fb.onSnapshot(
    fb.query(fb.collection(db, 'topics', id, 'arguments'), fb.orderBy('votes', 'desc')),
    snap => { state.currentArgs = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    err => console.error('args sub error', err)
  );
  state.topicUnsubs.push(topicUnsub, argsUnsub);
}

async function addArg(side){
  if(!requireAuth()) return;
  if(state.submittingArg[side]) return;
  state.submittingArg[side] = true;
  const btn = document.getElementById(side + '-submit-btn');
  try{
    const inputEl = document.getElementById(side + '-input');
    const text = inputEl.value.trim();
    if(!text){ state.submittingArg[side] = false; inputEl.style.borderColor = 'var(--con)'; inputEl.focus(); return; }
    if(btn){ btn.disabled = true; btn.textContent = 'Posting…'; }
    await fb.addDoc(fb.collection(db, 'topics', state.currentTopicId, 'arguments'), {
      side, text, votes: 0, voterChoices: {},
      author: state.user.displayName, authorUid: state.user.uid,
      createdAt: fb.serverTimestamp()
    });
    await fb.updateDoc(fb.doc(db, 'topics', state.currentTopicId), {
      [side === 'pro' ? 'proCount' : 'conCount']: fb.increment(1)
    });
    inputEl.value = '';
  }catch(e){
    alert("Couldn't post that argument. Try again.");
  }finally{
    state.submittingArg[side] = false;
    render();
  }
}

async function castVote(ref, currentChoices, direction){
  const uid = state.user.uid;
  const current = (currentChoices || {})[uid] || null;
  let delta = 0;
  let newChoice = direction;
  if(current === direction){
    delta = direction === 'up' ? -1 : 1;
    newChoice = null;
  } else if(!current){
    delta = direction === 'up' ? 1 : -1;
  } else {
    delta = direction === 'up' ? 2 : -2;
  }
  try{
    await fb.updateDoc(ref, {
      votes: fb.increment(delta),
      ['voterChoices.' + uid]: newChoice
    });
  }catch(e){ /* ignore transient errors, snapshot will resync */ }
}

async function vote(argId, direction){
  if(!requireAuth()) return;
  const arg = state.currentArgs.find(a => a.id === argId);
  if(!arg) return;
  const ref = fb.doc(db, 'topics', state.currentTopicId, 'arguments', argId);
  await castVote(ref, arg.voterChoices, direction);
}

async function voteTopic(topicId, direction, event){
  if(event) event.stopPropagation();
  if(!requireAuth()) return;
  const topic = (state.topics || []).find(t => t.id === topicId) || (state.currentTopic && state.currentTopic.id === topicId ? state.currentTopic : null);
  if(!topic) return;
  const ref = fb.doc(db, 'topics', topicId);
  await castVote(ref, topic.voterChoices, direction);
}

function shareTopic(){
  const url = location.origin + location.pathname + '?topic=' + state.currentTopicId;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(() => showToast('Link copied to clipboard')).catch(() => showToast(url));
  } else {
    showToast(url);
  }
}

/* ---------- seed a realistic fake debate for testing (safe to delete once done) ---------- */
async function seedExampleDebate(){
  if(!requireAuth()) return;
  try{
    const ref = await fb.addDoc(fb.collection(db, 'topics'), {
      title: 'Remote work is better than office work',
      description: 'Where should the 9-to-5 actually happen?',
      category: 'Society',
      createdAt: fb.serverTimestamp(),
      createdBy: state.user.uid, createdByName: state.user.displayName,
      proCount: 2, conCount: 2, votes: 14, voterChoices: {}
    });
    const fakeArgs = [
      { side: 'pro', author: 'Jordan Blake', authorUid: 'fake-jordan-blake', text: 'No commute means more time for family, hobbies, or just sleep. That adds up to hours every single week.', votes: 7 },
      { side: 'pro', author: 'Lena Ortiz', authorUid: 'fake-lena-ortiz', text: "People are demonstrably more productive without constant office interruptions — fewer 'quick questions' at your desk.", votes: 3 },
      { side: 'con', author: 'Chris Nakamura', authorUid: 'fake-chris-nakamura', text: 'In-person collaboration sparks ideas that a Slack thread never will. Whiteboard sessions just work better face to face.', votes: 6 },
      { side: 'con', author: 'Aisha Bello', authorUid: 'fake-aisha-bello', text: 'New hires learn company culture far faster sitting next to experienced teammates than through a screen.', votes: 2 }
    ];
    for(const a of fakeArgs){
      await fb.addDoc(fb.collection(db, 'topics', ref.id, 'arguments'), {
        side: a.side, text: a.text, votes: a.votes, voterChoices: {},
        author: a.author, authorUid: a.authorUid, createdAt: fb.serverTimestamp()
      });
    }
    await openTopic(ref.id);
    showToast('Test debate created — click "Debate" under any argument to try the flow.');
  }catch(e){
    alert("Couldn't seed the example debate. Check you're logged in and Firestore rules are published.");
  }
}

/* ---------- messaging ---------- */
function threadIdFor(uidA, uidB){ return [uidA, uidB].sort().join('_'); }

async function ensureThread(otherUid, otherName, topicContext){
  const tid = threadIdFor(state.user.uid, otherUid);
  const ref = fb.doc(db, 'threads', tid);
  const snap = await fb.getDoc(ref);
  if(!snap.exists()){
    await fb.setDoc(ref, {
      participantUids: [state.user.uid, otherUid],
      participantNames: { [state.user.uid]: state.user.displayName, [otherUid]: otherName },
      lastText: '', lastAuthorUid: '', lastTs: fb.serverTimestamp(), createdAt: fb.serverTimestamp(),
      topicId: topicContext ? topicContext.id : null,
      topicTitle: topicContext ? topicContext.title : null
    });
  }
  return tid;
}

async function sendThreadMessage(tid, otherUid, otherName, text){
  await fb.addDoc(fb.collection(db, 'threads', tid, 'messages'), {
    author: state.user.displayName, authorUid: state.user.uid, text, ts: fb.serverTimestamp()
  });
  await fb.setDoc(fb.doc(db, 'threads', tid), {
    participantUids: [state.user.uid, otherUid],
    participantNames: { [state.user.uid]: state.user.displayName, [otherUid]: otherName },
    lastText: text, lastAuthorUid: state.user.uid, lastTs: fb.serverTimestamp(),
    ['lastReadBy.' + state.user.uid]: fb.serverTimestamp()
  }, { merge: true });
}

async function challengeAuthor(argId){
  if(!requireAuth()) return;
  const arg = (state.currentArgs || []).find(a => a.id === argId);
  if(!arg) return;
  if(arg.authorUid === state.user.uid){ alert("That's your own argument."); return; }
  const mySide = arg.side === 'pro' ? 'con' : 'pro';
  const line = `Want to debate "${state.currentTopic.title}" one-on-one? I'll argue ${mySide}.`;
  const tid = await ensureThread(arg.authorUid, arg.author, { id: state.currentTopic.id, title: state.currentTopic.title });
  await sendThreadMessage(tid, arg.authorUid, arg.author, line);
  await openChat(tid, arg.authorUid, arg.author);
}

async function startChallenge(){
  if(!requireAuth()) return;
  const topic = state.currentTopic;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h3>Start a private debate</h3>
    <p style="font-size:13.5px;color:var(--text-soft);margin:0 0 12px;">Message someone directly about "${esc(topic.title)}". Enter their exact display name.</p>
    <label for="challenge-name">Their name</label>
    <input type="text" id="challenge-name" placeholder="e.g. Priya" style="margin-bottom:6px;">
    <label style="margin-top:10px;">Your side</label>
    <div class="side-choice">
      <button class="pro-c" id="choose-pro">Pro</button>
      <button class="con-c" id="choose-con">Con</button>
    </div>
    <div id="challenge-err" class="err" style="display:none;"></div>
    <div class="modal-actions"><button class="btn ghost" id="challenge-cancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(backdrop);
  const close = () => { if(document.body.contains(backdrop)) document.body.removeChild(backdrop); };
  backdrop.querySelector('#challenge-cancel').onclick = close;
  const go = async (side) => {
    const otherName = backdrop.querySelector('#challenge-name').value.trim();
    const errEl = backdrop.querySelector('#challenge-err');
    if(!otherName){ errEl.textContent = 'Enter their name first.'; errEl.style.display = 'block'; return; }
    if(otherName === state.user.displayName){ errEl.textContent = "That's you."; errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';
    try{
      const q = fb.query(fb.collection(db, 'users'), fb.where('displayName', '==', otherName));
      const snap = await fb.getDocs(q);
      if(snap.empty){ errEl.textContent = 'No user found with that exact name.'; errEl.style.display = 'block'; return; }
      const otherUid = snap.docs[0].id;
      close();
      const line = `Want to debate "${topic.title}" one-on-one? I'll argue ${side}.`;
      const tid = await ensureThread(otherUid, otherName, { id: topic.id, title: topic.title });
      await sendThreadMessage(tid, otherUid, otherName, line);
      await openChat(tid, otherUid, otherName);
    }catch(e){
      errEl.textContent = "Couldn't send that. Try again."; errEl.style.display = 'block';
    }
  };
  backdrop.querySelector('#choose-pro').onclick = () => go('pro');
  backdrop.querySelector('#choose-con').onclick = () => go('con');
}

async function openChat(tid, otherUid, otherName){
  cleanupChatSubs();
  state.view = 'chat';
  state.currentThreadId = tid;
  state.chatWithUid = otherUid;
  state.chatWithName = otherName;
  state.currentThread = null;
  state.chatMessages = [];
  state.chatAutoFocusPending = true;
  state.lastRenderedMsgCount = -1;
  pushUrl('');
  render();
  const threadUnsub = fb.onSnapshot(fb.doc(db, 'threads', tid), d => {
    const newThread = d.exists() ? { id: d.id, ...d.data() } : null;
    const relevantKeys = t => t ? JSON.stringify({ lastText: t.lastText, lastAuthorUid: t.lastAuthorUid, lastReadBy: t.lastReadBy }) : null;
    const changed = relevantKeys(state.currentThread) !== relevantKeys(newThread);
    state.currentThread = newThread;
    if(changed) render();
  }, err => console.error('thread sub error', err));
  const msgsUnsub = fb.onSnapshot(
    fb.query(fb.collection(db, 'threads', tid, 'messages'), fb.orderBy('ts', 'asc')),
    snap => { state.chatMessages = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    err => console.error('messages sub error', err)
  );
  state.chatUnsubs.push(threadUnsub, msgsUnsub);
  try{
    await fb.updateDoc(fb.doc(db, 'threads', tid), { ['lastReadBy.' + state.user.uid]: fb.serverTimestamp() });
  }catch(e){}
}

async function sendChatMsg(){
  if(state.submittingMsg) return;
  state.submittingMsg = true;
  const input = document.getElementById('chat-msg');
  const btn = document.getElementById('chat-send-btn');
  try{
    const text = input.value.trim();
    if(!text){ state.submittingMsg = false; return; }
    if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
    await sendThreadMessage(state.currentThreadId, state.chatWithUid, state.chatWithName, text);
    input.value = '';
  }catch(e){
    alert("Couldn't send that message. Try again.");
  }finally{
    state.submittingMsg = false;
    render();
  }
}

function handlePhotoFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 240;
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      let quality = 0.75;
      let dataUrl = canvas.toDataURL('image/jpeg', quality);
      while(dataUrl.length > 700000 && quality > 0.3){
        quality -= 0.1;
        dataUrl = canvas.toDataURL('image/jpeg', quality);
      }
      if(dataUrl.length > 900000){
        alert("That image is too large even after compressing — try a smaller or simpler photo.");
        return;
      }
      state.pendingPhotoDataUrl = dataUrl;
      updatePhotoPreview();
    };
    img.onerror = () => alert("Couldn't read that image. Try a different file.");
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removePhoto(){

async function submitProfile(){
  if(state.submittingProfile) return;
  state.submittingProfile = true;
  const btn = document.getElementById('save-profile-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try{
    const bio = document.getElementById('p-bio').value.trim();
    const gender = document.getElementById('p-gender').value.trim();
    const occupation = document.getElementById('p-occupation').value.trim();
    const political = state.selectedPolitical;
    const existingPhoto = (state.viewingProfile && state.viewingProfileUid === state.user.uid) ? state.viewingProfile.photoURL : null;
    let photoURL;
    if(state.pendingPhotoDataUrl === 'REMOVE') photoURL = null;
    else if(state.pendingPhotoDataUrl) photoURL = state.pendingPhotoDataUrl;
    else photoURL = existingPhoto || null;
    const saved = {
      displayName: state.user.displayName, email: state.user.email,
      photoURL, bio: bio || null,
      gender: gender || null, occupation: occupation || null,
      political: (political && political !== 'Prefer not to say') ? political : null
    };
    await fb.setDoc(fb.doc(db, 'users', state.user.uid), saved, { merge: true });
    state.pendingPhotoDataUrl = null;
    state.myProfile = { ...(state.myProfile || {}), ...saved };
    showToast('Profile saved');
    await openProfile(state.user.uid);
  }catch(e){
    alert("Couldn't save your profile. Try again — if the photo is large, try a smaller one.");
  }finally{
    state.submittingProfile = false;
  }
}

function renderList(app){
  const filtered = state.categoryFilter === 'all' ? state.topics : state.topics.filter(t => t.category === state.categoryFilter);
  const sorted = [...filtered].sort((a, b) => {
    if(state.sortMode === 'top') return (b.votes||0) - (a.votes||0);
    const at = a.createdAt ? (a.createdAt.toMillis ? a.createdAt.toMillis() : a.createdAt) : 0;
    const bt = b.createdAt ? (b.createdAt.toMillis ? b.createdAt.toMillis() : b.createdAt) : 0;
    return bt - at;
  });
  const trendingCutoff = state.topics.length ? Math.max(...state.topics.map(t => t.votes||0)) : 0;

  let rows;
  if(!state.topics.length){
    rows = `<div class="empty"><h3>No debates yet</h3><p>Be the first to start one — everyone who visits this site will see it.</p></div>`;
  } else if(!sorted.length){
    rows = `<div class="empty"><h3>Nothing in this category yet</h3><p>Try another filter, or start one here.</p></div>`;
  } else {
    rows = sorted.map(t => {
      const total = (t.proCount||0) + (t.conCount||0);
      const proPct = total ? Math.round((t.proCount/total)*100) : 50;
      const myChoice = state.user && t.voterChoices ? t.voterChoices[state.user.uid] : null;
      const isTrending = trendingCutoff >= 5 && (t.votes||0) === trendingCutoff;
      return `<div class="row" onclick="openTopic('${t.id}')">
        <div style="display:flex;gap:16px;align-items:flex-start;">
          <div class="vote-widget" style="flex-direction:column;flex-shrink:0;margin-top:2px;" onclick="event.stopPropagation()">
            <button class="vote-arrow up ${myChoice==='up'?'active':''}" onclick="voteTopic('${t.id}','up',event)">&#9650;</button>
            <span class="vote-count">${t.votes||0}</span>
            <button class="vote-arrow down ${myChoice==='down'?'active':''}" onclick="voteTopic('${t.id}','down',event)">&#9660;</button>
          </div>
          <div>
            ${isTrending ? `<span class="trending-tag">Trending</span>` : ''}
            <div class="category-badge">${esc(t.category || 'Other')}</div>
            <p class="row-title">${esc(t.title)}</p>
            ${t.description ? `<p class="row-desc">${esc(t.description)}</p>` : ''}
          </div>
        </div>
        <div class="row-meta">
          <div class="score-bar"><div class="p" style="width:${proPct}%"></div><div class="c" style="width:${100-proPct}%"></div></div>
          <span>${total} arg${total===1?'':'s'}</span>
        </div>
      </div>`;
    }).join('');
  }
  const chips = ['all', ...CATEGORIES].map(c => {
    const label = c === 'all' ? 'All' : c;
    return `<button class="category-chip ${state.categoryFilter===c?'active':''}" onclick="setCategoryFilter('${c}')">${label}</button>`;
  }).join('');

  const totalDebates = state.topics.length;
  const totalArguments = state.topics.reduce((sum, t) => sum + (t.proCount||0) + (t.conCount||0), 0);
  const totalVotes = state.topics.reduce((sum, t) => sum + (t.votes||0), 0);

  app.innerHTML = renderHeader() + `
    <div class="hero">
      <h1>Pick a side.<br>Make your <span class="accent">case</span>.</h1>
      <p>Post a debate, argue Pro or Con, and let the votes decide who's actually winning the argument.</p>

        ${state.user ? `<button class="btn ghost" onclick="seedExampleDebate()">Seed a test debate</button>` : `<button class="btn ghost" onclick="openAuthModal('signup')">Create an account</button>`}
      </div>
      <div class="stat-row">

      <div>
        <div class="col-head pro"><span class="label">Pro</span></div>
        ${pro.length ? pro.map((a,i)=>cardHtml(a,i+1)).join('') : '<div class="col-empty">No arguments yet. Be first.</div>'}
        <div class="add-arg">
          <textarea id="pro-input" placeholder="Make the case for..."></textarea>
          <button class="btn pro-btn" id="pro-submit-btn" onclick="addArg('pro')">Add to Pro</button>
        </div>
      </div>
      <div>
        <div class="col-head con"><span class="label">Con</span></div>
        ${con.length ? con.map((a,i)=>cardHtml(a,i+1)).join('') : '<div class="col-empty">No arguments yet. Be first.</div>'}
        <div class="add-arg">
          <textarea id="con-input" placeholder="Make the case against..."></textarea>
          <button class="btn con-btn" id="con-submit-btn" onclick="addArg('con')">Add to Con</button>
        </div>
      </div>
    </div>
    ${renderFooter()}
  `;
}

function renderInbox(app){
  const threads = [...(state.threads || [])].sort((a,b) => {
    const at = a.lastTs ? (a.lastTs.toMillis ? a.lastTs.toMillis() : a.lastTs) : 0;
    const bt = b.lastTs ? (b.lastTs.toMillis ? b.lastTs.toMillis() : b.lastTs) : 0;
    return bt - at;
  });
  const isFirstLoad = !state.inboxHasLoadedOnce;
  let rows;
  if(!threads.length){
    rows = `<div class="empty">
      <div class="empty-icon"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 12C8 9.79 9.79 8 12 8H36C38.21 8 40 9.79 40 12V30C40 32.21 38.21 34 36 34H16L8 41V12Z" stroke="var(--wine)" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
      <h3>No conversations yet</h3>
      <p>Hit "Debate" under someone's argument, or "Message someone about this" on any topic.</p>
    </div>`;
  } else {
    rows = threads.map((t, i) => {
      const otherUid = (t.participantUids || []).find(u => u !== state.user.uid);
      const otherName = (t.participantNames && t.participantNames[otherUid]) || 'someone';
      const lastTs = t.lastTs ? (t.lastTs.toMillis ? t.lastTs.toMillis() : t.lastTs) : 0;
      const readTs = t.lastReadBy && t.lastReadBy[state.user.uid] ? (t.lastReadBy[state.user.uid].toMillis ? t.lastReadBy[state.user.uid].toMillis() : t.lastReadBy[state.user.uid]) : 0;
      const unread = t.lastAuthorUid && t.lastAuthorUid !== state.user.uid && lastTs > readTs;
      const av = avatarStyle(otherName);
      const animStyle = isFirstLoad ? `style="animation-delay:${Math.min(i,8)*40}ms"` : '';
      return `<div class="thread-row ${unread?'unread-row':''} ${isFirstLoad?'row-in':''}" ${animStyle} onclick="openChat('${t.id}', '${otherUid}', '${esc(otherName).replace(/'/g,"&#39;")}')" style="border-left-color:${av.text};">
        <div onclick="event.stopPropagation();openProfile('${otherUid}')" style="cursor:pointer;">${avatarHtml(otherName, null, 'avatar-lg')}</div>
        <div class="thread-info">
          <div class="thread-top">
            <p class="thread-name author-link" onclick="event.stopPropagation();openProfile('${otherUid}')">${esc(otherName)}</p>
            <span class="thread-time">${timeAgo(t.lastTs)}</span>
          </div>
          ${t.topicTitle ? `<p class="thread-topic">on "${esc(t.topicTitle)}"</p>` : ''}
          <p class="thread-preview ${unread?'unread':''}">${t.lastAuthorUid===state.user.uid ? 'You: ' : ''}${esc(t.lastText || '')}</p>
        </div>
        ${unread ? '<div class="unread-dot"></div>' : ''}
      </div>`;
    }).join('');
  }
  state.inboxHasLoadedOnce = true;
  app.innerHTML = renderHeader() + `
    <button class="back" onclick="goList()">&larr; all debates</button>
    <h2 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:24px;margin:0 0 6px;letter-spacing:-0.01em;">Messages</h2>
    ${rows}
    ${renderFooter()}
  `;
}

function renderChat(app){
  const t = state.currentThread;
  const av = avatarStyle(state.chatWithName);
  if(!t){
    app.innerHTML = renderHeader() + `<div class="loading">loading conversation…</div>`;
    return;
  }

  // preserve whatever the person has typed but not sent yet, and whether they were mid-typing,
  // since this function can re-run in the background (new message arrives, read-receipt updates, etc.)
  const existingInput = document.getElementById('chat-msg');
  const preservedValue = existingInput ? existingInput.value : '';
  const hadFocus = existingInput && existingInput === document.activeElement;
  const preservedSelection = existingInput ? existingInput.selectionStart : null;

  // figure out if my last message has been seen by the other person
  const lastMineIdx = (() => {
    for(let i = state.chatMessages.length - 1; i >= 0; i--){
      if(state.chatMessages[i].authorUid === state.user.uid) return i;
    }
    return -1;
  })();
  const otherReadTs = t.lastReadBy && t.lastReadBy[state.chatWithUid]
    ? (t.lastReadBy[state.chatWithUid].toMillis ? t.lastReadBy[state.chatWithUid].toMillis() : t.lastReadBy[state.chatWithUid])
    : 0;

  const prevCount = state.lastRenderedMsgCount; // before this render updates it, so we know what's genuinely new

  const msgsHtml = state.chatMessages.length
    ? state.chatMessages.map((m, i) => {
        const mine = m.authorUid === state.user.uid;
        const msgTs = m.ts ? (m.ts.toMillis ? m.ts.toMillis() : m.ts) : 0;
        const showSeen = mine && i === lastMineIdx && otherReadTs >= msgTs && msgTs > 0;
        const nextSame = i < state.chatMessages.length - 1 && state.chatMessages[i+1].authorUid === m.authorUid;
        const prevSame = i > 0 && state.chatMessages[i-1].authorUid === m.authorUid;
        const isNew = prevCount >= 0 && i >= prevCount;
        const classes = ['msg', mine ? 'mine' : 'theirs'];
        if(nextSame) classes.push('msg-mid');
        if(prevSame) classes.push('msg-cont');
        if(isNew) classes.push('msg-new');
        const timeHtml = nextSame ? '' : `<div class="m-time">${timeAgo(m.ts)}${showSeen ? ' · Seen' : ''}</div>`;
        const bubble = `<div class="${classes.join(' ')}">${esc(m.text)}${timeHtml}</div>`;
        if(mine) return bubble;
        const avatarSlot = !prevSame
          ? `<div class="avatar avatar-sm" style="background:${av.text};color:#fff;">${esc(initials(state.chatWithName))}</div>`
          : `<div class="avatar-sm-spacer"></div>`;
        return `<div class="msg-row-theirs">${avatarSlot}${bubble}</div>`;
      }).join('')
    : `<div class="thread-empty">No messages yet. Say hello.</div>`;

  app.innerHTML = renderHeader() + `
    <button class="back" onclick="goInbox()">&larr; messages</button>
    <div class="chat-head" style="background:${av.bg};">
      <div class="avatar avatar-lg" style="background:${av.text};color:#fff;cursor:pointer;" onclick="openProfile('${state.chatWithUid}')">${esc(initials(state.chatWithName))}</div>
      <div>
        <h1 style="cursor:pointer;" onclick="openProfile('${state.chatWithUid}')">${esc(state.chatWithName)}</h1>
        ${t.topicTitle && t.topicId ? `<button class="topic-chip" onclick="openTopic('${t.topicId}')">Debating: ${esc(t.topicTitle)}</button>` : ''}
      </div>
    </div>
    <div class="thread">${msgsHtml}</div>
    <div class="msg-input-row">
      <textarea id="chat-msg" placeholder="Write a message… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="btn primary" id="chat-send-btn" onclick="sendChatMsg()">Send</button>
    </div>
    ${renderFooter()}
  `;

  const newInput = document.getElementById('chat-msg');
  if(newInput){
    newInput.value = preservedValue;
    newInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendChatMsg();
      }
    });
    if(hadFocus || state.chatAutoFocusPending){
      newInput.focus();
      const pos = preservedSelection !== null ? preservedSelection : newInput.value.length;
      newInput.selectionStart = newInput.selectionEnd = pos;
    }
  }
  state.chatAutoFocusPending = false;

  if(state.chatMessages.length !== state.lastRenderedMsgCount){
    state.lastRenderedMsgCount = state.chatMessages.length;
    const raf = window.requestAnimationFrame || function(fn){ setTimeout(fn, 16); };
    raf(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
  }
}

function renderProfile(app){
  const uid = state.viewingProfileUid;
  const p = state.viewingProfile;
  const isMe = state.user && state.user.uid === uid;
  if(!state.viewingProfileLoaded){
    app.innerHTML = renderHeader() + `<div class="loading">loading profile…</div>`;
    return;
  }
  const name = (p && p.displayName) || (isMe ? state.user.displayName : 'This debater');
  const fields = [];
  if(p && p.occupation) fields.push({ label: 'Occupation', value: p.occupation });
  if(p && p.gender) fields.push({ label: 'Gender', value: p.gender });
  if(p && p.political) fields.push({ label: 'Political leaning', value: p.political });

  const debates = state.viewingProfileDebates || [];
  const debatesHtml = debates.length
    ? debates.map(t => {
        const total = (t.proCount||0) + (t.conCount||0);
        const proPct = total ? Math.round((t.proCount/total)*100) : 50;
        return `<div class="row" onclick="openTopic('${t.id}')">
          <div>
            <div class="category-badge">${esc(t.category || 'Other')}</div>
            <p class="row-title">${esc(t.title)}</p>
            ${t.description ? `<p class="row-desc">${esc(t.description)}</p>` : ''}
          </div>
          <div class="row-meta">
            <div class="score-bar"><div class="p" style="width:${proPct}%"></div><div class="c" style="width:${100-proPct}%"></div></div>
            <span>${total} arg${total===1?'':'s'}</span>
          </div>
        </div>`;
      }).join('')
    : `<div class="empty"><h3>${isMe ? "You haven't" : `${esc(name)} hasn't`} started a debate yet</h3></div>`;

  app.innerHTML = renderHeader() + `
    <button class="back" onclick="goList()">&larr; all debates</button>
    <div class="profile-card">
      ${avatarHtml(name, p && p.photoURL, 'avatar-xl')}
      <div class="profile-main">
        <h1>${esc(name)}</h1>
        ${p && p.bio ? `<p class="profile-bio">${esc(p.bio)}</p>` : (isMe ? `<p class="profile-bio profile-bio-empty">You haven't added a bio yet.</p>` : '')}
        ${fields.length ? `<div class="profile-fields">${fields.map(f => `<div class="profile-field"><span class="pf-label">${esc(f.label)}</span><span class="pf-value">${esc(f.value)}</span></div>`).join('')}</div>` : ''}
        ${isMe ? `<button class="btn primary" onclick="goEditProfile()">Edit your profile</button>` : ''}
      </div>
    </div>
    <h2 class="section-heading">${isMe ? 'Debates you started' : `Debates ${esc(name)} started`}</h2>
    ${debatesHtml}
    ${renderFooter()}
  `;
}

function renderEditProfile(app){
  const p = state.viewingProfile && state.viewingProfileUid === state.user.uid ? state.viewingProfile : {};
  app.innerHTML = renderHeader() + `
    <button class="back" onclick="openProfile('${state.user.uid}')">&larr; your profile</button>
    <div class="panel">
      <h2>Edit your profile</h2>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:-14px 0 26px;">Everything here is optional and public — anyone can see it if they click your name.</p>

      <div class="form-section">
        <h3 class="form-section-title">Photo</h3>
        <div class="photo-edit-row">
          <div id="p-photo-preview-wrap">${avatarHtml(state.user.displayName, p.photoURL, 'avatar-xl')}</div>
          <div class="photo-edit-actions">
            <label class="btn ghost" for="p-photo-file" style="cursor:pointer;display:inline-block;">Upload a photo</label>
            <input type="file" id="p-photo-file" accept="image/*" style="display:none;" onchange="handlePhotoFile(this)">
            ${p.photoURL ? `<button type="button" class="btn ghost" onclick="removePhoto()">Remove photo</button>` : ''}
            <p class="photo-hint">JPG or PNG, resized automatically. Nothing is uploaded until you hit Save.</p>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3 class="form-section-title">About you</h3>
        <label for="p-bio">Short bio</label>
        <textarea id="p-bio" rows="3" placeholder="A sentence about you or your debating style.">${esc(p.bio || '')}</textarea>
      </div>

      <div class="form-section">
        <h3 class="form-section-title">Details <span class="form-section-sub">(all optional)</span></h3>
        <div class="form-grid-2">
          <div>
            <label for="p-occupation">Occupation</label>
            <input type="text" id="p-occupation" placeholder="e.g. Teacher, Software Engineer" value="${esc(p.occupation || '')}">
          </div>
          <div>
            <label for="p-gender">Gender</label>
            <input type="text" id="p-gender" placeholder="e.g. Woman, Man, Non-binary" value="${esc(p.gender || '')}">
          </div>
        </div>
        <label>Political spectrum</label>
        <div class="chip-select" id="p-political-chips">
          ${POLITICAL_OPTIONS.map(o => `<button type="button" class="option-chip ${state.selectedPolitical===o?'active':''}" onclick="selectPolitical('${esc(o)}', this)">${esc(o)}</button>`).join('')}
        </div>
      </div>

      <div class="form-actions">
        <button class="btn primary" id="save-profile-btn" onclick="submitProfile()">Save profile</button>
        <button class="btn ghost" onclick="openProfile('${state.user.uid}')">Cancel</button>
      </div>
    </div>
    ${renderFooter()}
  `;
}

/* ---------- wire up window globals for inline onclick handlers ---------- */
Object.assign(window, {
  goList, goNew, goInbox, openTopic, openChat, submitTopic, addArg, vote, voteTopic,
  shareTopic, challengeAuthor, startChallenge, sendChatMsg, setCategoryFilter, setSortMode,
  openAuthModal, logOut, seedExampleDebate, openProfile, goEditProfile, submitProfile,
  handlePhotoFile, removePhoto, selectPolitical, toggleUserMenu
});

/* ---------- init ---------- */
window.addEventListener('popstate', () => {
  const id = new URLSearchParams(location.search).get('topic');
  if(id) openTopic(id); else goList();
});

if(NEEDS_SETUP){
  render();
} else {
  fb.onAuthStateChanged(auth, (user) => {
    state.user = user ? { uid: user.uid, displayName: user.displayName, email: user.email } : null;
    state.myProfile = null;
    state.userMenuOpen = false;
    if(user){
      fb.getDoc(fb.doc(db, 'users', user.uid)).then(snap => {
        state.myProfile = snap.exists() ? snap.data() : {};
        render();
      }).catch(() => {});
    }
    subscribeInbox();
    render();
  });
  subscribeTopics();
  const initialId = new URLSearchParams(location.search).get('topic');
  if(initialId) openTopic(initialId); else render();
  document.addEventListener('click', (e) => {
    if(state.userMenuOpen && !e.target.closest('.user-menu')){
      state.userMenuOpen = false;
      render();
    }
  });
}
</script>
