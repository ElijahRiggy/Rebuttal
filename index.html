<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebuttal — pick a side</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFECE3;
    --surface:#F7F5EE;
    --surface-hi:#EDEAE0;
    --hair:#D9D5C7;
    --hair-strong:#C7C2AF;
    --text:#1B2740;
    --text-soft:#5B6478;
    --text-mute:#8891A0;
    --gold:#8A6A16;
    --gold-tint:#F1E7CC;
    --pro:#0F6E56;
    --pro-tint:#E1F0EA;
    --pro-tint-2:#CDE6DC;
    --con:#9A3E1E;
    --con-tint:#F3E7DF;
    --con-tint-2:#EAD3C1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 24px 80px;}
  header.site{
    display:flex;align-items:center;justify-content:space-between;
    padding:32px 0 20px;border-bottom:1px solid var(--hair);
    margin-bottom:28px;flex-wrap:wrap;gap:10px;
  }
  .wordmark{
    font-family:'Fraunces', serif;
    font-size:28px;font-weight:600;letter-spacing:-0.01em;
    display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text);
  }
  .wordmark .bolt{color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:18px;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-mute);letter-spacing:.02em;}
  .btn{
    font-family:'Inter',sans-serif;font-size:14px;font-weight:500;
    border:1px solid var(--hair-strong);background:transparent;color:var(--text);
    padding:9px 16px;border-radius:3px;cursor:pointer;transition:background .15s,color .15s,opacity .15s;
  }
  .btn:hover{background:var(--text);color:var(--bg);border-color:var(--text);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn:disabled:hover{background:transparent;color:var(--text);}
  .btn.ghost{border-color:var(--hair);color:var(--text-soft);}
  .btn.ghost:hover{background:var(--surface-hi);color:var(--text);}
  .btn.primary{background:var(--text);color:var(--bg);border-color:var(--text);}
  .btn.primary:hover{opacity:.85;background:var(--text);}
  .btn.primary:disabled{opacity:.45;}

  .nav-right{display:flex;align-items:center;gap:14px;}
  .messages-nav{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-soft);
    background:none;border:1px solid var(--hair);border-radius:20px;padding:6px 14px;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .messages-nav:hover{border-color:var(--gold);color:var(--gold);}
  .messages-nav.active{border-color:var(--gold);color:var(--gold);background:var(--gold-tint);}
  .badge-dot{background:var(--gold);color:var(--gold-tint);border-radius:10px;padding:1px 6px;font-size:11px;font-weight:600;}

  /* Topic list */
  .row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
    padding:22px 0;border-bottom:1px solid var(--hair);cursor:pointer;
  }
  .row:hover .row-title{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px;}
  .row-title{
    font-family:'Fraunces',serif;font-size:21px;font-weight:500;margin:0 0 6px;
  }
  .row-desc{font-size:14px;color:var(--text-soft);margin:0;max-width:560px;line-height:1.5;}
  .row-meta{
    display:flex;gap:14px;align-items:center;white-space:nowrap;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-mute);
    padding-top:4px;
  }
  .score-bar{
    display:flex;width:56px;height:6px;border-radius:3px;overflow:hidden;background:var(--hair);
  }
  .score-bar .p{background:var(--pro);height:100%;}
  .score-bar .c{background:var(--con);height:100%;}

  .empty{padding:60px 0;text-align:center;color:var(--text-soft);}
  .empty h3{font-family:'Fraunces',serif;font-weight:500;font-size:19px;color:var(--text);margin-bottom:6px;}

  .banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--con-tint);border:1px solid var(--con-tint-2);border-radius:6px;
    padding:12px 16px;margin-bottom:18px;font-size:13.5px;color:var(--text);
  }
  .banner .btn{padding:5px 12px;font-size:12.5px;}

  /* New topic form */
  .panel{
    background:var(--surface);border:1px solid var(--hair);border-radius:6px;
    padding:24px;margin-bottom:28px;
  }
  .panel h2{font-family:'Fraunces',serif;font-size:18px;font-weight:500;margin:0 0 16px;}
  label{display:block;font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text-mute);margin-bottom:6px;}
  input[type=text], textarea{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;color:var(--text);
    background:#fff;border:1px solid var(--hair-strong);border-radius:4px;padding:10px 12px;
    margin-bottom:16px;resize:vertical;
  }
  input[type=text]::placeholder, textarea::placeholder{color:var(--text-mute);}
  input[type=text]:focus, textarea:focus{outline:none;border-color:var(--gold);}
  .err{font-size:12.5px;color:var(--con);margin:-10px 0 14px;}
  .form-actions{display:flex;gap:10px;}

  /* Debate view */
  .back{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-soft);background:none;border:none;cursor:pointer;padding:0;margin-bottom:18px;display:inline-flex;align-items:center;gap:5px;}
  .back:hover{color:var(--text);}
  .topic-head{margin-bottom:22px;}
  .topic-head h1{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1.2;margin:0 0 10px;}
  .topic-head p{font-size:15px;color:var(--text-soft);line-height:1.6;margin:0;max-width:680px;}

  .tally{
    display:flex;border:1px solid var(--hair);border-radius:6px;overflow:hidden;margin-bottom:18px;
    font-family:'IBM Plex Mono',monospace;
  }
  .tally .side{flex:1;padding:14px 18px;}
  .tally .side.pro{background:var(--pro-tint);}
  .tally .side.con{background:var(--con-tint);}
  .tally .side .n{font-size:24px;font-weight:500;font-family:'Fraunces',serif;}
  .tally .side.pro .n{color:var(--pro);}
  .tally .side.con .n{color:var(--con);}
  .tally .side .l{font-size:11.5px;color:var(--text-mute);letter-spacing:.03em;}

  .challenge-row{display:flex;justify-content:flex-end;margin:0 0 24px;}
  .challenge-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);background:var(--gold-tint);border:1px solid var(--gold);border-radius:20px;padding:6px 14px;cursor:pointer;}
  .challenge-btn:hover{opacity:.8;}

  .columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:680px){.columns{grid-template-columns:1fr;}}
  .col-head{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid;
  }
  .col-head.pro{border-color:var(--pro);}
  .col-head.con{border-color:var(--con);}
  .col-head span.label{font-family:'Fraunces',serif;font-size:17px;font-weight:500;}
  .col-head.pro span.label{color:var(--pro);}
  .col-head.con span.label{color:var(--con);}

  .arg-card{
    background:var(--surface);border:1px solid var(--hair);border-radius:6px;
    padding:14px 16px;margin-bottom:12px;
  }
  .arg-text{font-size:14.5px;line-height:1.55;margin:0 0 10px;color:var(--text);}
  .arg-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-mute);margin:0 0 10px;}
  .arg-foot{display:flex;align-items:center;justify-content:space-between;}
  .vote-btn{
    display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--hair-strong);
    border-radius:20px;padding:4px 12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
    font-size:13px;color:var(--text-soft);transition:.15s;
  }
  .vote-btn:hover{border-color:var(--gold);color:var(--gold);}
  .vote-btn.voted{background:var(--gold-tint);border-color:var(--gold);color:var(--gold);}
  .debate-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);background:none;border:1px solid var(--gold);border-radius:16px;padding:4px 10px;cursor:pointer;}
  .debate-btn:hover{background:var(--gold-tint);}

  .add-arg{margin-top:6px;}
  .add-arg textarea{margin-bottom:8px;min-height:70px;}
  .add-arg .btn{width:100%;font-size:13.5px;}
  .add-arg .btn.pro-btn{border-color:var(--pro);color:var(--pro);}
  .add-arg .btn.pro-btn:hover{background:var(--pro);color:#fff;}
  .add-arg .btn.con-btn{border-color:var(--con);color:var(--con);}
  .add-arg .btn.con-btn:hover{background:var(--con);color:#fff;}

  .col-empty{font-size:13.5px;color:var(--text-mute);padding:18px 0;text-align:center;border:1px dashed var(--hair);border-radius:6px;margin-bottom:12px;}
  .loading{padding:60px 0;text-align:center;color:var(--text-mute);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(27,39,64,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--surface);border-radius:8px;border:1px solid var(--hair);padding:26px;max-width:400px;width:100%;}
  .modal h3{font-family:'Fraunces',serif;font-size:19px;font-weight:500;margin:0 0 14px;color:var(--text);}
  .modal .side-choice{display:flex;gap:10px;margin:8px 0 16px;}
  .modal .side-choice button{flex:1;padding:14px;border-radius:6px;border:1px solid var(--hair);background:#fff;cursor:pointer;font-family:'Fraunces',serif;font-size:15px;}
  .modal .side-choice button.pro-c{color:var(--pro);}
  .modal .side-choice button.pro-c:hover{background:var(--pro-tint);border-color:var(--pro);}
  .modal .side-choice button.con-c{color:var(--con);}
  .modal .side-choice button.con-c:hover{background:var(--con-tint);border-color:var(--con);}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}

  /* Inbox / profile list */
  .thread-row{
    display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--hair);cursor:pointer;
  }
  .thread-row:hover{background:var(--surface);}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:500;font-size:15px;
  }
  .thread-info{flex:1;min-width:0;}
  .thread-top{display:flex;justify-content:space-between;gap:10px;}
  .thread-name{font-family:'Fraunces',serif;font-size:16px;font-weight:500;margin:0;}
  .thread-time{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-mute);white-space:nowrap;}
  .thread-preview{font-size:13.5px;color:var(--text-soft);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .thread-preview.unread{color:var(--text);font-weight:500;}
  .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;}

  /* Chat view */
  .chat-head{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .chat-head .avatar{width:38px;height:38px;font-size:14px;}
  .chat-head h1{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:0;flex:1;}
  .thread{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;min-height:120px;}
  .msg{max-width:74%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.5;}
  .msg .m-time{font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-top:4px;opacity:.6;}
  .msg.mine{align-self:flex-end;background:var(--text);color:var(--bg);border-bottom-right-radius:3px;}
  .msg.theirs{align-self:flex-start;background:var(--surface);border:1px solid var(--hair);color:var(--text);border-bottom-left-radius:3px;}
  .thread-empty{text-align:center;color:var(--text-mute);font-size:13.5px;padding:30px 0;}
  .msg-input-row{display:flex;gap:8px;}
  .msg-input-row textarea{flex:1;min-height:44px;margin:0;}
  .msg-input-row button{white-space:nowrap;}

  /* Auth */
  .auth-nav{display:flex;align-items:center;gap:8px;}
  .auth-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-soft);background:none;border:1px solid var(--hair);border-radius:20px;padding:6px 14px;cursor:pointer;}
  .auth-btn:hover{border-color:var(--gold);color:var(--gold);}
  .auth-btn.filled{background:var(--text);color:var(--bg);border-color:var(--text);}
  .auth-btn.filled:hover{opacity:.85;}
  .user-chip{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-soft);}
  .user-chip strong{color:var(--text);font-weight:500;}
  .setup-screen{max-width:640px;margin:60px auto;padding:0 24px;}
  .setup-screen h1{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0 0 12px;}
  .setup-screen p{font-size:14.5px;color:var(--text-soft);line-height:1.6;}
  .setup-screen ol{font-size:14.5px;color:var(--text-soft);line-height:1.9;padding-left:20px;}
  .setup-screen code{background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:2px 6px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);}
  .setup-screen pre{background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:14px 16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;overflow-x:auto;color:var(--text);}

  /* Categories */
  .category-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .category-chip{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-soft);background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:5px 13px;cursor:pointer;}
  .category-chip:hover{border-color:var(--gold);color:var(--gold);}
  .category-chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .category-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--gold);background:var(--gold-tint);border-radius:10px;padding:2px 9px;margin-bottom:8px;letter-spacing:.02em;}
  select#t-category{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;color:var(--text);
    background:#fff;border:1px solid var(--hair-strong);border-radius:4px;padding:10px 12px;
    margin-bottom:16px;
  }

  /* Share + toast */
  .topic-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .share-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-soft);background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:6px 14px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .share-btn:hover{border-color:var(--gold);color:var(--gold);}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--text);color:var(--bg);font-size:13.5px;padding:10px 18px;
    border-radius:20px;z-index:60;font-family:'Inter',sans-serif;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">loading rebuttal…</div>
</div>

<script type="module">
/* ================== FIREBASE SETUP ==================
   1. Go to https://console.firebase.google.com, create a free project.
   2. In the project, click the "</>" (web app) icon to register a web app — this gives you a config object.
   3. Enable Authentication → Sign-in method → Email/Password.
   4. Enable Firestore Database → Create database → Start in production mode (rules are provided in the README).
   5. Paste your config object below, replacing the placeholder.
====================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDAa8I3tatze2LvOXAv76ojbyyAXHbtRc4",
  authDomain: "rebuttal-debate.firebaseapp.com",
  projectId: "rebuttal-debate",
  storageBucket: "rebuttal-debate.firebasestorage.app",
  messagingSenderId: "152941002207",
  appId: "1:152941002207:web:6350d27697419aaf3b186a"
};

const NEEDS_SETUP = firebaseConfig.apiKey === "YOUR_API_KEY";

const CATEGORIES = ['Society', 'Technology', 'Politics', 'Health', 'Entertainment', 'Sports', 'Science', 'Other'];

let app, auth, db;
let fb = {}; // holds imported firestore/auth functions once loaded

if (!NEEDS_SETUP) {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  app = initializeApp(firebaseConfig);
  auth = authMod.getAuth(app);
  db = fsMod.getFirestore(app);
  fb = { ...authMod, ...fsMod };
}

const state = {
  view: 'list', user: null, authError: null,
  topics: [], categoryFilter: 'all',
  currentTopicId: null, currentTopic: null, currentArgs: [],
  threads: [], currentThreadId: null, currentThread: null, chatWithUid: null, chatWithName: null, chatMessages: [],
  submittingTopic: false, submittingArg: { pro: false, con: false }, submittingMsg: false, submittingAuth: false,
  topicUnsubs: [], chatUnsubs: [], globalUnsubs: [],
  toastMsg: null, toastTimer: null
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ const d=document.createElement('div'); d.textContent=s ?? ''; return d.innerHTML; }
function timeAgo(ts){
  if(!ts) return '';
  const ms = ts.toMillis ? ts.toMillis() : ts;
  const s = Math.floor((Date.now()-ms)/1000);
  if(s<60) return 'just now';
  const m = Math.floor(s/60); if(m<60) return m+'m';
  const h = Math.floor(m/60); if(h<24) return h+'h';
  const d = Math.floor(h/24); return d+'d';
}
function initials(name){
  const parts = (name||'?').trim().split(/\s+/).slice(0,2);
  return parts.map(w=>w[0].toUpperCase()).join('') || '?';
}
function avatarStyle(name){
  const palette = [
    {bg:'var(--pro-tint)', text:'var(--pro)'},
    {bg:'var(--con-tint)', text:'var(--con)'},
    {bg:'var(--gold-tint)', text:'var(--gold)'},
    {bg:'var(--surface-hi)', text:'var(--text)'}
  ];
  let hash = 0;
  for(const c of (name||'')) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
  return palette[hash % palette.length];
}
function showToast(msg){
  state.toastMsg = msg;
  render();
  if(state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => { state.toastMsg = null; render(); }, 2500);
}
function pushUrl(qs){
  history.pushState({}, '', location.pathname + qs);
}

/* ---------- auth ---------- */
function requireAuth(){
  if(!state.user){ openAuthModal('login'); return false; }
  return true;
}
function friendlyAuthError(code){
  const map = {
    'auth/email-already-in-use': 'That email already has an account — try logging in instead.',
    'auth/invalid-email': 'That email address doesn\'t look right.',
    'auth/weak-password': 'Password needs to be at least 6 characters.',
    'auth/wrong-password': 'Wrong password.',
    'auth/invalid-credential': 'Email or password is incorrect.',
    'auth/user-not-found': 'No account with that email.',
    'auth/too-many-requests': 'Too many attempts — wait a bit and try again.',
    'auth/missing-email': 'Enter your email first.'
  };
  return map[code] || 'Something went wrong. Try again.';
}

function openAuthModal(mode){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const isSignup = mode === 'signup';
  backdrop.innerHTML = `<div class="modal">
    <h3>${isSignup ? 'Create an account' : 'Log in'}</h3>
    ${isSignup ? `<label for="auth-name">Display name</label><input type="text" id="auth-name" placeholder="How others will see you" style="margin-bottom:12px;">` : ''}
    <label for="auth-email">Email</label>
    <input type="text" id="auth-email" placeholder="you@example.com" style="margin-bottom:12px;">
    <label for="auth-pass">Password</label>
    <input type="text" id="auth-pass" placeholder="${isSignup ? 'At least 6 characters' : 'Your password'}" style="margin-bottom:6px;">
    ${!isSignup ? `<button id="auth-forgot" style="background:none;border:none;padding:0;margin:0 0 6px;font-size:12.5px;color:var(--text-mute);cursor:pointer;text-decoration:underline;">Forgot password?</button>` : ''}
    <div id="auth-err" class="err" style="display:none;"></div>
    <div id="auth-info" style="font-size:12.5px;color:var(--pro);margin:-10px 0 14px;display:none;"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="auth-switch">${isSignup ? 'Log in instead' : 'Create account instead'}</button>
      <button class="btn primary" id="auth-submit">${isSignup ? 'Sign up' : 'Log in'}</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  const close = () => { if(document.body.contains(backdrop)) document.body.removeChild(backdrop); };
  backdrop.querySelector('#auth-switch').onclick = () => { close(); openAuthModal(isSignup ? 'login' : 'signup'); };
  if(!isSignup){
    backdrop.querySelector('#auth-forgot').onclick = async () => {
      const email = backdrop.querySelector('#auth-email').value.trim();
      const errEl = backdrop.querySelector('#auth-err');
      const infoEl = backdrop.querySelector('#auth-info');
      errEl.style.display = 'none';
      if(!email){
        errEl.textContent = 'Enter your email above first, then click "Forgot password?" again.';
        errEl.style.display = 'block';
        return;
      }
      const forgotBtn = backdrop.querySelector('#auth-forgot');
      forgotBtn.disabled = true;
      try{
        await fb.sendPasswordResetEmail(auth, email);
        infoEl.textContent = `Reset link sent to ${email} — check your inbox (and spam folder).`;
        infoEl.style.display = 'block';
      }catch(e){
        errEl.textContent = friendlyAuthError(e.code);
        errEl.style.display = 'block';
      }finally{
        forgotBtn.disabled = false;
      }
    };
  }
  backdrop.querySelector('#auth-submit').onclick = async () => {
    if(state.submittingAuth) return;
    const email = backdrop.querySelector('#auth-email').value.trim();
    const pass = backdrop.querySelector('#auth-pass').value;
    const name = isSignup ? backdrop.querySelector('#auth-name').value.trim() : null;
    const errEl = backdrop.querySelector('#auth-err');
    if(!email || !pass || (isSignup && !name)){
      errEl.textContent = 'Fill in all fields.'; errEl.style.display = 'block'; return;
    }
    state.submittingAuth = true;
    const btn = backdrop.querySelector('#auth-submit');
    btn.disabled = true; btn.textContent = isSignup ? 'Creating…' : 'Logging in…';
    try{
      if(isSignup){
        const cred = await fb.createUserWithEmailAndPassword(auth, email, pass);
        await fb.updateProfile(cred.user, { displayName: name });
        await fb.setDoc(fb.doc(db, 'users', cred.user.uid), { displayName: name, email, createdAt: fb.serverTimestamp() });
        state.user = { uid: cred.user.uid, displayName: name, email };
        subscribeInbox();
        render();
      } else {
        await fb.signInWithEmailAndPassword(auth, email, pass);
      }
      close();
    }catch(e){
      errEl.textContent = friendlyAuthError(e.code); errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = isSignup ? 'Sign up' : 'Log in';
    }finally{
      state.submittingAuth = false;
    }
  };
}
async function logOut(){
  await fb.signOut(auth);
  goList();
}

/* ---------- realtime subscriptions ---------- */
function subscribeTopics(){
  const q = fb.query(fb.collection(db, 'topics'), fb.orderBy('createdAt', 'desc'), fb.limit(200));
  const unsub = fb.onSnapshot(q, snap => {
    state.topics = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(state.view === 'list') render();
  }, err => console.error('topics sub error', err));
  state.globalUnsubs.push(unsub);
}
function subscribeInbox(){
  cleanupGlobalInboxSub();
  if(!state.user) { state.threads = []; return; }
  const q = fb.query(fb.collection(db, 'threads'), fb.where('participantUids', 'array-contains', state.user.uid));
  const unsub = fb.onSnapshot(q, snap => {
    state.threads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => console.error('inbox sub error', err));
  state.globalUnsubs.push(unsub);
}
function cleanupGlobalInboxSub(){ /* handled by full teardown on logout if needed */ }
function cleanupTopicSubs(){
  state.topicUnsubs.forEach(u => u());
  state.topicUnsubs = [];
}
function cleanupChatSubs(){
  state.chatUnsubs.forEach(u => u());
  state.chatUnsubs = [];
}

function unreadCount(){
  if(!state.user) return 0;
  return (state.threads || []).filter(t => {
    const lastTs = t.lastTs ? (t.lastTs.toMillis ? t.lastTs.toMillis() : t.lastTs) : 0;
    const readTs = t.lastReadBy && t.lastReadBy[state.user.uid] ? (t.lastReadBy[state.user.uid].toMillis ? t.lastReadBy[state.user.uid].toMillis() : t.lastReadBy[state.user.uid]) : 0;
    return t.lastAuthorUid && t.lastAuthorUid !== state.user.uid && lastTs > readTs;
  }).length;
}

/* ---------- topics / arguments ---------- */
async function submitTopic(){
  if(!requireAuth()) return;
  if(state.submittingTopic) return;
  const title = document.getElementById('t-title').value.trim();
  const desc = document.getElementById('t-desc').value.trim();
  const category = document.getElementById('t-category').value;
  const errEl = document.getElementById('t-err');
  if(!title){ errEl.textContent = 'Give the debate a topic first.'; errEl.style.display = 'block'; return; }
  state.submittingTopic = true;
  const btn = document.getElementById('create-topic-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Creating…'; }
  try{
    const ref = await fb.addDoc(fb.collection(db, 'topics'), {
      title, description: desc, category,
      createdAt: fb.serverTimestamp(),
      createdBy: state.user.uid, createdByName: state.user.displayName,
      proCount: 0, conCount: 0, votes: 0, votedBy: []
    });
    await openTopic(ref.id);
  }catch(e){
    alert("Couldn't create that debate. Try again.");
  }finally{
    state.submittingTopic = false;
  }
}

async function openTopic(id){
  cleanupTopicSubs();
  state.currentTopicId = id;
  state.currentTopic = null;
  state.currentArgs = [];
  state.view = 'topic';
  pushUrl('?topic=' + id);
  render();
  const topicUnsub = fb.onSnapshot(fb.doc(db, 'topics', id), d => {
    state.currentTopic = d.exists() ? { id: d.id, ...d.data() } : null;
    render();
  }, err => console.error('topic sub error', err));
  const argsUnsub = fb.onSnapshot(
    fb.query(fb.collection(db, 'topics', id, 'arguments'), fb.orderBy('votes', 'desc')),
    snap => { state.currentArgs = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    err => console.error('args sub error', err)
  );
  state.topicUnsubs.push(topicUnsub, argsUnsub);
}

async function addArg(side){
  if(!requireAuth()) return;
  if(state.submittingArg[side]) return;
  state.submittingArg[side] = true;
  const btn = document.getElementById(side + '-submit-btn');
  try{
    const inputEl = document.getElementById(side + '-input');
    const text = inputEl.value.trim();
    if(!text){ state.submittingArg[side] = false; inputEl.style.borderColor = 'var(--con)'; inputEl.focus(); return; }
    if(btn){ btn.disabled = true; btn.textContent = 'Posting…'; }
    await fb.addDoc(fb.collection(db, 'topics', state.currentTopicId, 'arguments'), {
      side, text, votes: 0, votedBy: [],
      author: state.user.displayName, authorUid: state.user.uid,
      createdAt: fb.serverTimestamp()
    });
    await fb.updateDoc(fb.doc(db, 'topics', state.currentTopicId), {
      [side === 'pro' ? 'proCount' : 'conCount']: fb.increment(1)
    });
    inputEl.value = '';
  }catch(e){
    alert("Couldn't post that argument. Try again.");
  }finally{
    state.submittingArg[side] = false;
    render();
  }
}

async function vote(argId){
  if(!requireAuth()) return;
  const arg = state.currentArgs.find(a => a.id === argId);
  if(!arg) return;
  const uid = state.user.uid;
  const voted = (arg.votedBy || []).includes(uid);
  const ref = fb.doc(db, 'topics', state.currentTopicId, 'arguments', argId);
  try{
    if(voted){
      await fb.updateDoc(ref, { votes: fb.increment(-1), votedBy: fb.arrayRemove(uid) });
    } else {
      await fb.updateDoc(ref, { votes: fb.increment(1), votedBy: fb.arrayUnion(uid) });
    }
  }catch(e){ /* ignore transient errors, snapshot will resync */ }
}

async function voteTopic(topicId, event){
  if(event) event.stopPropagation();
  if(!requireAuth()) return;
  const topic = (state.topics || []).find(t => t.id === topicId) || (state.currentTopic && state.currentTopic.id === topicId ? state.currentTopic : null);
  if(!topic) return;
  const uid = state.user.uid;
  const voted = (topic.votedBy || []).includes(uid);
  const ref = fb.doc(db, 'topics', topicId);
  try{
    if(voted){
      await fb.updateDoc(ref, { votes: fb.increment(-1), votedBy: fb.arrayRemove(uid) });
    } else {
      await fb.updateDoc(ref, { votes: fb.increment(1), votedBy: fb.arrayUnion(uid) });
    }
  }catch(e){ /* ignore transient errors, snapshot will resync */ }
}

function shareTopic(){
  const url = location.origin + location.pathname + '?topic=' + state.currentTopicId;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(() => showToast('Link copied to clipboard')).catch(() => showToast(url));
  } else {
    showToast(url);
  }
}

/* ---------- messaging ---------- */
function threadIdFor(uidA, uidB){ return [uidA, uidB].sort().join('_'); }

async function ensureThread(otherUid, otherName){
  const tid = threadIdFor(state.user.uid, otherUid);
  const ref = fb.doc(db, 'threads', tid);
  const snap = await fb.getDoc(ref);
  if(!snap.exists()){
    await fb.setDoc(ref, {
      participantUids: [state.user.uid, otherUid],
      participantNames: { [state.user.uid]: state.user.displayName, [otherUid]: otherName },
      lastText: '', lastAuthorUid: '', lastTs: fb.serverTimestamp(), createdAt: fb.serverTimestamp()
    });
  }
  return tid;
}

async function sendThreadMessage(tid, otherUid, otherName, text){
  await fb.addDoc(fb.collection(db, 'threads', tid, 'messages'), {
    author: state.user.displayName, authorUid: state.user.uid, text, ts: fb.serverTimestamp()
  });
  await fb.setDoc(fb.doc(db, 'threads', tid), {
    participantUids: [state.user.uid, otherUid],
    participantNames: { [state.user.uid]: state.user.displayName, [otherUid]: otherName },
    lastText: text, lastAuthorUid: state.user.uid, lastTs: fb.serverTimestamp(),
    ['lastReadBy.' + state.user.uid]: fb.serverTimestamp()
  }, { merge: true });
}

async function challengeAuthor(argId){
  if(!requireAuth()) return;
  const arg = (state.currentArgs || []).find(a => a.id === argId);
  if(!arg) return;
  if(arg.authorUid === state.user.uid){ alert("That's your own argument."); return; }
  const mySide = arg.side === 'pro' ? 'con' : 'pro';
  const line = `Want to debate "${state.currentTopic.title}" one-on-one? I'll argue ${mySide}.`;
  const tid = await ensureThread(arg.authorUid, arg.author);
  await sendThreadMessage(tid, arg.authorUid, arg.author, line);
  await openChat(tid, arg.authorUid, arg.author);
}

async function startChallenge(){
  if(!requireAuth()) return;
  const topic = state.currentTopic;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h3>Start a private debate</h3>
    <p style="font-size:13.5px;color:var(--text-soft);margin:0 0 12px;">Message someone directly about "${esc(topic.title)}". Enter their exact display name.</p>
    <label for="challenge-name">Their name</label>
    <input type="text" id="challenge-name" placeholder="e.g. Priya" style="margin-bottom:6px;">
    <label style="margin-top:10px;">Your side</label>
    <div class="side-choice">
      <button class="pro-c" id="choose-pro">Pro</button>
      <button class="con-c" id="choose-con">Con</button>
    </div>
    <div id="challenge-err" class="err" style="display:none;"></div>
    <div class="modal-actions"><button class="btn ghost" id="challenge-cancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(backdrop);
  const close = () => { if(document.body.contains(backdrop)) document.body.removeChild(backdrop); };
  backdrop.querySelector('#challenge-cancel').onclick = close;
  const go = async (side) => {
    const otherName = backdrop.querySelector('#challenge-name').value.trim();
    const errEl = backdrop.querySelector('#challenge-err');
    if(!otherName){ errEl.textContent = 'Enter their name first.'; errEl.style.display = 'block'; return; }
    if(otherName === state.user.displayName){ errEl.textContent = "That's you."; errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';
    try{
      const q = fb.query(fb.collection(db, 'users'), fb.where('displayName', '==', otherName));
      const snap = await fb.getDocs(q);
      if(snap.empty){ errEl.textContent = 'No user found with that exact name.'; errEl.style.display = 'block'; return; }
      const otherUid = snap.docs[0].id;
      close();
      const line = `Want to debate "${topic.title}" one-on-one? I'll argue ${side}.`;
      const tid = await ensureThread(otherUid, otherName);
      await sendThreadMessage(tid, otherUid, otherName, line);
      await openChat(tid, otherUid, otherName);
    }catch(e){
      errEl.textContent = "Couldn't send that. Try again."; errEl.style.display = 'block';
    }
  };
  backdrop.querySelector('#choose-pro').onclick = () => go('pro');
  backdrop.querySelector('#choose-con').onclick = () => go('con');
}

async function goInbox(){
  if(!requireAuth()) return;
  cleanupChatSubs();
  state.view = 'inbox';
  pushUrl('');
  render();
}

async function openChat(tid, otherUid, otherName){
  cleanupChatSubs();
  state.view = 'chat';
  state.currentThreadId = tid;
  state.chatWithUid = otherUid;
  state.chatWithName = otherName;
  state.currentThread = null;
  state.chatMessages = [];
  pushUrl('');
  render();
  const threadUnsub = fb.onSnapshot(fb.doc(db, 'threads', tid), d => {
    state.currentThread = d.exists() ? { id: d.id, ...d.data() } : null;
    render();
  }, err => console.error('thread sub error', err));
  const msgsUnsub = fb.onSnapshot(
    fb.query(fb.collection(db, 'threads', tid, 'messages'), fb.orderBy('ts', 'asc')),
    snap => { state.chatMessages = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    err => console.error('messages sub error', err)
  );
  state.chatUnsubs.push(threadUnsub, msgsUnsub);
  try{
    await fb.updateDoc(fb.doc(db, 'threads', tid), { ['lastReadBy.' + state.user.uid]: fb.serverTimestamp() });
  }catch(e){}
}

async function sendChatMsg(){
  if(state.submittingMsg) return;
  state.submittingMsg = true;
  const input = document.getElementById('chat-msg');
  const btn = document.getElementById('chat-send-btn');
  try{
    const text = input.value.trim();
    if(!text){ state.submittingMsg = false; return; }
    if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
    await sendThreadMessage(state.currentThreadId, state.chatWithUid, state.chatWithName, text);
    input.value = '';
  }catch(e){
    alert("Couldn't send that message. Try again.");
  }finally{
    state.submittingMsg = false;
    render();
  }
}

/* ================== RENDERING ================== */
function render(){
  const app = document.getElementById('app');
  if(NEEDS_SETUP) return renderSetupScreen(app);
  if(!state.user && (state.view === 'chat' || state.view === 'inbox' || state.view === 'new')){
    state.view = 'list';
  }
  if(state.view === 'list') renderList(app);
  else if(state.view === 'new') renderNew(app);
  else if(state.view === 'topic') renderTopic(app);
  else if(state.view === 'inbox') renderInbox(app);
  else if(state.view === 'chat') renderChat(app);
  renderToast();
}

function renderToast(){
  let el = document.getElementById('toast-el');
  if(el) el.remove();
  if(state.toastMsg){
    el = document.createElement('div');
    el.id = 'toast-el';
    el.className = 'toast';
    el.textContent = state.toastMsg;
    document.body.appendChild(el);
  }
}

function renderList(app){
  const filtered = state.categoryFilter === 'all' ? state.topics : state.topics.filter(t => t.category === state.categoryFilter);
  let rows;
  if(!state.topics.length){
    rows = `<div class="empty"><h3>No debates yet</h3><p>Be the first to start one — everyone who visits this site will see it.</p></div>`;

    rows = `<div class="empty"><h3>Nothing in this category yet</h3><p>Try another filter, or start one here.</p></div>`;

    rows = filtered.map(t => {
      const total = (t.proCount||0) + (t.conCount||0);
      const proPct = total ? Math.round((t.proCount/total)*100) : 50;
      const topicVoted = state.user && (t.votedBy || []).includes(state.user.uid);
      return `<div class="row" onclick="openTopic('${t.id}')">
        <div style="display:flex;gap:14px;align-items:flex-start;">

          </button>
          <div>
            <div class="category-badge">${esc(t.category || 'Other')}</div>
            <p class="row-title">${esc(t.title)}</p>
            ${t.description ? `<p class="row-desc">${esc(t.description)}</p>` : ''}

        </div>

          <div class="score-bar"><div class="p" style="width:${proPct}%"></div><div class="c" style="width:${100-proPct}%"></div></div>

function renderNew(app){

function renderTopic(app){
  if(!state.currentTopic){
    app.innerHTML = renderHeader() + `<div class="loading">loading debate…</div>`;
    return;
  }
  const topic = state.currentTopic;
  const args = state.currentArgs;
  const pro = args.filter(a => a.side === 'pro');
  const con = args.filter(a => a.side === 'con');

  const cardHtml = (a) => {
    const voted = state.user && (a.votedBy || []).includes(state.user.uid);
    const canChallenge = a.authorUid && (!state.user || a.authorUid !== state.user.uid);
    return `<div class="arg-card">
      <p class="arg-text">${esc(a.text)}</p>
      <p class="arg-meta">${a.author ? esc(a.author) : 'anonymous'} &middot; ${timeAgo(a.createdAt)}</p>
      <div class="arg-foot">
        <button class="vote-btn ${voted?'voted':''}" onclick="vote('${a.id}')">
          <span>${voted ? '&#9650;' : '&#9651;'}</span><span>${a.votes||0}</span>
        </button>
        ${canChallenge ? `<button class="debate-btn" onclick="challengeAuthor('${a.id}')">Debate &rarr;</button>` : ''}
      </div>
    </div>`;
  };

  const topicVoted = state.user && (topic.votedBy || []).includes(state.user.uid);
  app.innerHTML = renderHeader() + `
    <button class="back" onclick="goList()">&larr; all debates</button>
    <div class="topic-head-row">
      <div class="topic-head">
        <div class="category-badge">${esc(topic.category || 'Other')}</div>
        <h1>${esc(topic.title)}</h1>
        ${topic.description ? `<p>${esc(topic.description)}</p>` : ''}
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button class="vote-btn ${topicVoted?'voted':''}" onclick="voteTopic('${topic.id}')">
          <span>${topicVoted ? '&#9650;' : '&#9651;'}</span><span>${topic.votes||0}</span>
        </button>
        <button class="share-btn" onclick="shareTopic()">Share &#8599;</button>
      </div>
    </div>
    <div class="tally">
      <div class="side pro"><div class="n">${pro.length}</div><div class="l">pro arguments</div></div>
      <div class="side con"><div class="n">${con.length}</div><div class="l">con arguments</div></div>
    </div>
    <div class="challenge-row">
      <button class="challenge-btn" onclick="startChallenge()">Message someone about this &rarr;</button>
    </div>
    <div class="columns">
      <div>
        <div class="col-head pro"><span class="label">Pro</span></div>
        ${pro.length ? pro.map(cardHtml).join('') : '<div class="col-empty">No arguments yet. Be first.</div>'}
        <div class="add-arg">
          <textarea id="pro-input" placeholder="Make the case for..."></textarea>
          <button class="btn pro-btn" id="pro-submit-btn" onclick="addArg('pro')">Add to Pro</button>
        </div>
      </div>
      <div>
        <div class="col-head con"><span class="label">Con</span></div>
        ${con.length ? con.map(cardHtml).join('') : '<div class="col-empty">No arguments yet. Be first.</div>'}
        <div class="add-arg">
          <textarea id="con-input" placeholder="Make the case against..."></textarea>
          <button class="btn con-btn" id="con-submit-btn" onclick="addArg('con')">Add to Con</button>
        </div>
      </div>
    </div>
  `;
}

function renderInbox(app){
  const threads = [...(state.threads || [])].sort((a,b) => {
    const at = a.lastTs ? (a.lastTs.toMillis ? a.lastTs.toMillis() : a.lastTs) : 0;
    const bt = b.lastTs ? (b.lastTs.toMillis ? b.lastTs.toMillis() : b.lastTs) : 0;
    return bt - at;
  });
  let rows;
  if(!threads.length){
    rows = `<div class="empty"><h3>No conversations yet</h3><p>Hit "Debate" under someone's argument, or "Message someone about this" on any topic.</p></div>`;
  } else {
    rows = threads.map(t => {
      const otherUid = (t.participantUids || []).find(u => u !== state.user.uid);
      const otherName = (t.participantNames && t.participantNames[otherUid]) || 'someone';
      const lastTs = t.lastTs ? (t.lastTs.toMillis ? t.lastTs.toMillis() : t.lastTs) : 0;
      const readTs = t.lastReadBy && t.lastReadBy[state.user.uid] ? (t.lastReadBy[state.user.uid].toMillis ? t.lastReadBy[state.user.uid].toMillis() : t.lastReadBy[state.user.uid]) : 0;
      const unread = t.lastAuthorUid && t.lastAuthorUid !== state.user.uid && lastTs > readTs;
      const av = avatarStyle(otherName);
      return `<div class="thread-row" onclick="openChat('${t.id}', '${otherUid}', '${esc(otherName).replace(/'/g,"&#39;")}')">
        <div class="avatar" style="background:${av.bg};color:${av.text};">${esc(initials(otherName))}</div>
        <div class="thread-info">
          <div class="thread-top">
            <p class="thread-name">${esc(otherName)}</p>
            <span class="thread-time">${timeAgo(t.lastTs)}</span>
          </div>
          <p class="thread-preview ${unread?'unread':''}">${t.lastAuthorUid===state.user.uid ? 'you: ' : ''}${esc(t.lastText || '')}</p>
        </div>
        ${unread ? '<div class="unread-dot"></div>' : ''}
      </div>`;
    }).join('');
  }
  app.innerHTML = renderHeader() + `
    <button class="back" onclick="goList()">&larr; all debates</button>
    <h2 style="font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0 0 4px;">Messages</h2>
    ${rows}
  `;
}

function renderChat(app){
  const t = state.currentThread;
  const av = avatarStyle(state.chatWithName);
  if(!t){
    app.innerHTML = renderHeader() + `<div class="loading">loading conversation…</div>`;
    return;
  }
  const msgsHtml = state.chatMessages.length
    ? state.chatMessages.map(m => {
        const mine = m.authorUid === state.user.uid;
        return `<div class="msg ${mine?'mine':'theirs'}">${esc(m.text)}<div class="m-time">${timeAgo(m.ts)}</div></div>`;
      }).join('')
    : `<div class="thread-empty">No messages yet. Say hello.</div>`;

  app.innerHTML = renderHeader() + `
    <button class="back" onclick="goInbox()">&larr; messages</button>
    <div class="chat-head">
      <div class="avatar" style="background:${av.bg};color:${av.text};">${esc(initials(state.chatWithName))}</div>
      <h1>${esc(state.chatWithName)}</h1>
    </div>
    <div class="thread">${msgsHtml}</div>
    <div class="msg-input-row">
      <textarea id="chat-msg" placeholder="Write a message…"></textarea>
      <button class="btn primary" id="chat-send-btn" onclick="sendChatMsg()">Send</button>
    </div>
  `;
}

/* ---------- wire up window globals for inline onclick handlers ---------- */
Object.assign(window, {
  goList, goNew, goInbox, openTopic, openChat, submitTopic, addArg, vote, voteTopic,
  shareTopic, challengeAuthor, startChallenge, sendChatMsg, setCategoryFilter,
  openAuthModal, logOut, seedExampleDebate
});

/* ---------- init ---------- */
window.addEventListener('popstate', () => {
  const id = new URLSearchParams(location.search).get('topic');
  if(id) openTopic(id); else goList();
});

if(NEEDS_SETUP){
  render();
} else {
  fb.onAuthStateChanged(auth, (user) => {
    state.user = user ? { uid: user.uid, displayName: user.displayName, email: user.email } : null;
    subscribeInbox();
    render();
  });
  subscribeTopics();
  const initialId = new URLSearchParams(location.search).get('topic');
  if(initialId) openTopic(initialId); else render();
}
</script>
</body>
</html>
